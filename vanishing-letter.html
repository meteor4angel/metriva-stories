my.png","columns":1,"rows":1,"frames":{"idle":"assets/character-bellamy.png","speaking":"assets/character-bellamy-speaking.png","thoughtful":"assets/character-bellamy-thoughtful.png","blink":"assets/character-bellamy-blink.png"}},"clara":{"src":"assets/character-clara.png","columns":1,"rows":1,"frames":{"idle":"assets/character-clara.png","speaking":"assets/character-clara-speaking.png","thoughtful":"assets/character-clara-thoughtful.png","blink":"assets/character-clara-blink.png"}},"mr-finch":{"src":"assets/character-finch.png","columns":1,"rows":1,"frames":{"idle":"assets/character-finch.png","speaking":"assets/character-finch-speaking.png","thoughtful":"assets/character-finch-thoughtful.png","blink":"assets/character-finch-blink.png"}}},"voiceMap":{"[\"Mrs. Bellamy\",\"I left a letter on the writing desk. It means more to me than I can explain. Will you help me find it?\"]":"assets/voices/01-shop-bellamy-introduction.mp3","[\"Mrs. Bellamy\",\"“On the writing desk before we closed. I thought I was ready to send it.”\",\"mrs-bellamy\",\"q1\",\"1\",\"0\"]":"assets/voices/01-shop-bellamy-q01-answer.mp3","[\"Mrs. Bellamy\",\"Thank you. The little things may explain more than I can just now.\",\"mrs-bellamy\",\"q1\",\"3\",\"0\"]":"assets/voices/01-shop-bellamy-q01-follow-up.mp3","[\"Mrs. Bellamy\",\"“Clara has a key, but I locked the front door myself. The back window is old and difficult to latch.”\",\"mrs-bellamy\",\"q2\",\"1\",\"0\"]":"assets/voices/01-shop-bellamy-q02-answer.mp3","[\"Mrs. Bellamy\",\"Yes. It has been troublesome for years. Please do not assume the worst of Clara.\",\"mrs-bellamy\",\"q2\",\"3\",\"0\"]":"assets/voices/01-shop-bellamy-q02-follow-up.mp3","[\"Mrs. Bellamy\",\"“Elena always loved lavender. I kept a ribbon aside for her, years ago.”\",\"mrs-bellamy\",\"q3\",\"1\",\"0\"]":"assets/voices/01-shop-bellamy-q03-answer.mp3","[\"Mrs. Bellamy\",\"She does. Some friendships stay with us even when the letters stop.\",\"mrs-bellamy\",\"q3\",\"3\",\"0\"]":"assets/voices/01-shop-bellamy-q03-follow-up.mp3","[\"Mrs. Bellamy\",\"“Elena. We planted the first spring flowers together in 1986.”\",\"mrs-bellamy\",\"q1\",\"1\",\"2\"]":"assets/voices/03-office-bellamy-q01-answer.mp3","[\"Mrs. Bellamy\",\"Yes. I remember the lavender as if it had been planted yesterday.\",\"mrs-bellamy\",\"q1\",\"3\",\"2\"]":"assets/voices/03-office-bellamy-q01-follow-up.mp3","[\"Mrs. Bellamy\",\"“Some words become harder to say the longer you wait.”\",\"mrs-bellamy\",\"q2\",\"1\",\"2\"]":"assets/voices/03-office-bellamy-q02-answer.mp3","[\"Mrs. Bellamy\",\"Handle them gently. They contain things I never found the courage to say.\",\"mrs-bellamy\",\"q2\",\"3\",\"2\"]":"assets/voices/03-office-bellamy-q02-follow-up.mp3","[\"Mrs. Bellamy\",\"“I always used the year of our first garden. Only the last three digits.”\",\"mrs-bellamy\",\"q3\",\"1\",\"2\"]":"assets/voices/03-office-bellamy-q03-answer.mp3","[\"Mrs. Bellamy\",\"Only its last three digits. The reminder is there beside the lock.\",\"mrs-bellamy\",\"q3\",\"3\",\"2\"]":"assets/voices/03-office-bellamy-q03-follow-up.mp3","[\"Mrs. Bellamy\",\"“It was where Elena and I promised we would never stop writing.”\",\"mrs-bellamy\",\"q1\",\"1\",\"3\"]":"assets/voices/04-garden-bellamy-q01-answer.mp3","[\"Mrs. Bellamy\",\"It was a promise. I hoped it might become one again.\",\"mrs-bellamy\",\"q1\",\"3\",\"3\"]":"assets/voices/04-garden-bellamy-q01-follow-up.mp3","[\"Mrs. Bellamy\",\"“Yes. I thought the garden might help me find the courage.”\",\"mrs-bellamy\",\"q2\",\"1\",\"3\"]":"assets/voices/04-garden-bellamy-q02-answer.mp3","[\"Mrs. Bellamy\",\"Thank you. The letter belongs to a friendship, not to a stranger.\",\"mrs-bellamy\",\"q2\",\"3\",\"3\"]":"assets/voices/04-garden-bellamy-q02-follow-up.mp3","[\"Mrs. Bellamy\",\"“I returned after closing. I could not bear to send it, but I could not destroy it either.”\",\"mrs-bellamy\",\"q1\",\"1\",\"4\"]":"assets/voices/05-finale-bellamy-q01-answer.mp3","[\"Mrs. Bellamy\",\"I did. I was afraid to send it, and afraid to let it go.\",\"mrs-bellamy\",\"q1\",\"3\",\"4\"]":"assets/voices/05-finale-bellamy-q01-follow-up.mp3","[\"Mrs. Bellamy\",\"“Perhaps I can finally tell Elena the truth myself.”\",\"mrs-bellamy\",\"q2\",\"1\",\"4\"]":"assets/voices/05-finale-bellamy-q02-answer.mp3","[\"Mrs. Bellamy\",\"Perhaps this time I will choose words before silence chooses for me.\",\"mrs-bellamy\",\"q2\",\"3\",\"4\"]":"assets/voices/05-finale-bellamy-q02-follow-up.mp3","[\"Clara\",\"“No. Mrs. Bellamy asked me to wait. I left it on the desk.”\",\"clara\",\"q1\",\"1\",\"0\"]":"assets/voices/01-clara-q01-answer.mp3","[\"Clara\",\"Yes. I never took it to the post. We should find out what happened after closing.\",\"clara\",\"q1\",\"3\",\"0\"]":"assets/voices/01-clara-q01-follow-up.mp3","[\"Clara\",\"“I checked the greenhouse stock and signed the ledger at 6:20. That is all the ledger can prove.”\",\"clara\",\"q2\",\"1\",\"0\"]":"assets/voices/01-clara-q02-answer.mp3","[\"Clara\",\"Exactly. The ledger records one moment. It does not explain the earlier ribbon sale.\",\"clara\",\"q2\",\"3\",\"0\"]":"assets/voices/01-clara-q02-follow-up.mp3","[\"Clara\",\"“Miso was playing with something brass under the register.”\",\"clara\",\"q3\",\"1\",\"0\"]":"assets/voices/01-clara-q03-answer.mp3","[\"Clara\",\"Look under the counter. He has been batting it around all afternoon.\",\"clara\",\"q3\",\"3\",\"0\"]":"assets/voices/01-clara-q03-follow-up.mp3","[\"Clara\",\"“That is when I finished the stock count, not when I arrived.”\",\"clara\",\"q1\",\"1\",\"1\"]":"assets/voices/02-clara-q01-answer.mp3","[\"Clara\",\"Yes. Read it together with the receipt, and keep the times separate.\",\"clara\",\"q1\",\"3\",\"1\"]":"assets/voices/02-clara-q01-follow-up.mp3","[\"Clara\",\"“Mr. Finch helped with the planting records. He might know.”\",\"clara\",\"q2\",\"1\",\"1\"]":"assets/voices/02-clara-q02-answer.mp3","[\"Clara\",\"The old records should help you connect the token to a place.\",\"clara\",\"q2\",\"3\",\"1\"]":"assets/voices/02-clara-q02-follow-up.mp3","[\"Clara\",\"“The Memorial Garden, when it first opened in 1986.”\",\"clara\",\"q1\",\"1\",\"2\"]":"assets/voices/03-clara-q01-answer.mp3","[\"Clara\",\"The photograph and the lock belong to the same history.\",\"clara\",\"q1\",\"3\",\"2\"]":"assets/voices/03-clara-q01-follow-up.mp3","[\"Clara\",\"“In the locked drawer, if Mrs. Bellamy still has it.”\",\"clara\",\"q2\",\"1\",\"2\"]":"assets/voices/03-clara-q02-answer.mp3","[\"Clara\",\"Take your time. Mrs. Bellamy kept those words for a reason.\",\"clara\",\"q2\",\"3\",\"2\"]":"assets/voices/03-clara-q02-follow-up.mp3","[\"Clara\",\"“No. The clues looked suspicious, but the truth is kinder.”\",\"clara\",\"q1\",\"1\",\"4\"]":"assets/voices/05-clara-q01-answer.mp3","[\"Clara\",\"That is why it mattered to listen before deciding what the clues meant.\",\"clara\",\"q1\",\"3\",\"4\"]":"assets/voices/05-clara-q01-follow-up.mp3","[\"Mr. Finch\",\"“The same damp potting mix as these trays. But it is sold all over Willowmere.”\",\"mr-finch\",\"q1\",\"1\",\"1\"]":"assets/voices/02-greenhouse-finch-q01-answer.mp3","[\"Mr. Finch\",\"Precisely. It is a useful connection, but not proof of who opened the window.\",\"mr-finch\",\"q1\",\"3\",\"1\"]":"assets/voices/02-greenhouse-finch-q01-follow-up.mp3","[\"Mr. Finch\",\"“It is the oldest flower bed in the Memorial Garden. Lavender was planted there first.”\",\"mr-finch\",\"q2\",\"1\",\"1\"]":"assets/voices/02-greenhouse-finch-q02-answer.mp3","[\"Mr. Finch\",\"Let the records guide you. The first spring bed was lavender.\",\"mr-finch\",\"q2\",\"3\",\"1\"]":"assets/voices/02-greenhouse-finch-q02-follow-up.mp3","[\"Mr. Finch\",\"“No. I was outside. Her ledger entry was later than that.”\",\"mr-finch\",\"q3\",\"1\",\"1\"]":"assets/voices/02-greenhouse-finch-q03-answer.mp3","[\"Mr. Finch\",\"A wise distinction. What I did not see cannot serve as anyone’s alibi.\",\"mr-finch\",\"q3\",\"3\",\"1\"]":"assets/voices/02-greenhouse-finch-q03-follow-up.mp3","[\"Mr. Finch\",\"“The lavender bed. Look for the stone with a recess.”\",\"mr-finch\",\"q1\",\"1\",\"3\"]":"assets/voices/04-garden-finch-q01-answer.mp3","[\"Mr. Finch\",\"Find the small stone recess. The old token was made for it.\",\"mr-finch\",\"q1\",\"3\",\"3\"]":"assets/voices/04-garden-finch-q01-follow-up.mp3","[\"Mr. Finch\",\"“I remember a token like that. It belonged to the old garden keepsake box.”\",\"mr-finch\",\"q2\",\"1\",\"3\"]":"assets/voices/04-garden-finch-q02-answer.mp3","[\"Mr. Finch\",\"Yes. The inscription tells you where to begin.\",\"mr-finch\",\"q2\",\"3\",\"3\"]":"assets/voices/04-garden-finch-q02-follow-up.mp3"},"autoVoice":true}</script>
