<!doctype html><html><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/story-engine.css?v=ordering-cards-20261023"><style>body{background:#253b30}#preview-tools{padding:8px;position:fixed;top:0;left:0;z-index:100}#preview-tools select{padding:7px}</style></head><body><div id="preview-tools"><select aria-label="Puzzle preview" id="choose"></select></div><main id="story-root"></main><div id="story-modal" class="s6-overlay is-hidden"></div><script src="js/story-engine.js?v=ordering-cards-20261023"></script><script>
(async()=>{const entries=[];for(const n of [1,2,3,4,5,7]){const story=await fetch('stories/story-0'+n+'.json').then(r=>r.json());story.chapters.forEach((ch,i)=>{if(ch.puzzle.presentation?.layout==='card-slots')entries.push({story,ch,i});});}const select=document.querySelector('#choose');select.innerHTML=entries.map((x,i)=>'<option value="'+i+'">Story '+x.story.number+' · '+x.ch.puzzle.title+'</option>').join('');function show(){const {story,ch,i}=entries[select.value||0];const r=new MetrivaStoryEngine.StoryRuntime({story,repository:{save:async()=>({revision:1})},mount:'#story-root',modal:'#story-modal'});r.state=r.normalize({chapter:i});r.current=()=>ch;r.showCleanTimelinePuzzle(ch,ch.puzzle);}select.addEventListener('change',show);show();})();
</script></body></html>
