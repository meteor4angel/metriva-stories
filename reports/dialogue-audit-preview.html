<!doctype html><html><head><meta charset="utf-8"><base href="../"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="css/story-engine.css?v=story7-gold-progress-20261023"></head><body><main id="story-root" class="story6-shell"></main><div id="story-modal" class="s6-overlay is-hidden"></div><script src="js/scene-companion.js?v=story7-gold-progress-20261023"></script><script src="js/days-conversations.js"></script><script src="js/story-engine.js?v=story7-gold-progress-20261023"></script><script>(async()=>{const params=new URLSearchParams(location.search),n=Number(params.get('story')||7),chapter=Number(params.get('chapter')||2)-1,story=await fetch('stories/story-0'+n+'.json').then(r=>r.json());if(n===5)story.conversationScript=DAYS_CONVERSATIONS;const runtime=new MetrivaStoryEngine.StoryRuntime({story,repository:{save:async()=>({revision:1})},mount:'#story-root',modal:'#story-modal'});runtime.state=runtime.normalize({chapter});runtime.current=()=>story.chapters[chapter];if(params.has("progress"))runtime.progress=()=>Math.max(0,Math.min(100,Number(params.get("progress"))||0));runtime.applyPageAppearance();runtime.render();const person=story.chapters[chapter].characters.find(p=>p.id===params.get("character"));if(person){runtime.state.conversationOpenings=[chapter];runtime.state.dialogue={chapter,characterId:person.id,questionId:person.questions[0].id,phase:"exchange",line:1};runtime.renderDialogue();}})();</script></body></html>
