<!doctype html><html><head><meta charset="utf-8"><base href="../"><link rel="stylesheet" href="css/story-engine.css?v=sprite-crop-fix-20261023"><style>body{background:#35463c;padding:20px;color:#fffaf1}h2{margin:20px 0 10px}.gallery{display:grid;grid-template-columns:repeat(6,1fr);gap:12px}.frame{min-width:0;border:1px solid #9aab9144;border-radius:9px;background:#1e3025;padding:6px;text-align:center}.frame .s6-conversation-portrait{display:block!important;position:relative!important;left:auto!important;bottom:auto!important;transform:none!important;width:100%!important;height:190px!important;max-height:none!important;aspect-ratio:1!important;animation:none!important}.frame small{display:block}</style></head><body><main class="s6-story07-conversation" id="cast"></main><script src="js/story-engine.js?v=sprite-crop-fix-20261023"></script><script>(async()=>{const story=await fetch('stories/story-07.json').then(r=>r.json()),runtime=Object.create(MetrivaStoryEngine.StoryRuntime.prototype);runtime.story=story;let html='';for(const [id,sprite]of Object.entries(story.characterSprites)){const count=id==='clockmaker'?24:id==='biscuit'?30:sprite.frameFiles.length;let rows='';for(let i=0;i<count;i++){const alias='audit'+i;sprite.frames[alias]=sprite.frameFiles?sprite.frameFiles[i]:i;rows+='<div class="frame">'+runtime.portrait({id,name:id,expression:alias},'s6-conversation-portrait')+'<small>'+id+' '+(i+1)+'</small></div>';}html+='<h2>'+id+'</h2><section class="gallery">'+rows+'</section>';}document.querySelector('#cast').innerHTML=html;})();</script></body></html>
