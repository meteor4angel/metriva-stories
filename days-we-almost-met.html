\"Mira\",\"Of course. That is a real choice too.\"]":"assets/voices/days/days-mira-ch05-q2-answer-opening-v2.mp3","[\"Mira\",\"No. We already have books and the garden.\"]":"assets/voices/days/days-mira-ch05-q2-reply-opening-v2.mp3","[\"Theo\",\"The reading table starts at eleven. You would be welcome there.\"]":"assets/voices/days/days-theo-ch01-intro.mp3","[\"Theo\",\"Most Sundays. Books are a good excuse to meet the neighbors.\"]":"assets/voices/days/days-theo-ch01-q1-answer.mp3","[\"Theo\",\"Only if you count debating the ending over coffee.\"]":"assets/voices/days/days-theo-ch01-q1-reply.mp3","[\"Theo\",\"Just inside, beside the window.\"]":"assets/voices/days/days-theo-ch01-q2-answer.mp3","[\"Theo\",\"One chapter is a very good start.\"]":"assets/voices/days/days-theo-ch01-q2-reply.mp3","[\"Theo\",\"I like an ending that leaves room for both people to choose.\"]":"assets/voices/days/days-theo-ch02-intro.mp3","[\"Theo\",\"Too many stories mistake a grand gesture for listening.\"]":"assets/voices/days/days-theo-ch02-q1-answer.mp3","[\"Theo\",\"Ask a question, and hear the answer.\"]":"assets/voices/days/days-theo-ch02-q1-reply.mp3","[\"Theo\",\"Black coffee. I should probably switch to tea.\"]":"assets/voices/days/days-theo-ch02-q2-answer.mp3","[\"Theo\",\"Then we have found a perfectly balanced table.\"]":"assets/voices/days/days-theo-ch02-q2-reply.mp3","[\"Theo\",\"Market Street is still open. We can take the short way, if you want company.\"]":"assets/voices/days/days-theo-ch03-intro.mp3","[\"Theo\",\"The council closed it until Monday.\"]":"assets/voices/days/days-theo-ch03-q1-answer.mp3","[\"Theo\",\"Open, but far longer. We would miss the start.\"]":"assets/voices/days/days-theo-ch03-q1-reply.mp3","[\"Theo\",\"Not yet. The cleanup begins at three.\"]":"assets/voices/days/days-theo-ch03-q2-answer.mp3","[\"Theo\",\"No rush. We have fifteen minutes to walk.\"]":"assets/voices/days/days-theo-ch03-q2-reply.mp3","[\"Theo\",\"I practiced this for the fundraiser. I did not know you knew it too.\"]":"assets/voices/days/days-theo-ch04-intro.mp3","[\"Theo\",\"C, E, G, E. The tune comes back once you start.\"]":"assets/voices/days/days-theo-ch04-q1-answer.mp3","[\"Theo\",\"I will. You can join whenever you feel ready.\"]":"assets/voices/days/days-theo-ch04-q1-reply.mp3","[\"Theo\",\"I think we were in the same room, years ago.\"]":"assets/voices/days/days-theo-ch04-q2-answer.mp3","[\"Theo\",\"Maybe we should write the next verse ourselves.\"]":"assets/voices/days/days-theo-ch04-q2-reply.mp3","[\"Theo\",\"Would you like to meet again next Saturday? Coffee, if that sounds good to you.\"]":"assets/voices/days/days-theo-ch05-intro.mp3","[\"Theo\",\"You said you are free after four. I remembered.\"]":"assets/voices/days/days-theo-ch05-q1-answer.mp3","[\"Theo\",\"Then we keep our reading table and our garden Saturdays.\"]":"assets/voices/days/days-theo-ch05-q2-answer.mp3","[\"Theo\",\"I do. Your answer matters more than my plan.\"]":"assets/voices/days/days-theo-ch05-q2-reply.mp3","[\"Theo\",\"Yeah. I was hoping I’d get to see you again.\"]":"assets/voices/days/days-theo-ch05-replacement-threeway.mp3","[\"Mira\",\"Thanks for helping. Not exactly the first impression I was hoping for.\"]":"assets/voices/days/days-mira-ch01-new-01-threeway-review-v3.mp3","[\"Theo\",\"For what it’s worth, I was hoping for a reason to say hello.\"]":"assets/voices/days/days-theo-ch01-new-02-threeway-review-v3.mp3","[\"Mira\",\"Would it be all right if I stayed for just one chapter?\"]":"assets/voices/days/days-mira-ch01-new-03-threeway.mp3","[\"Theo\",\"I was hoping you’d come back. You left me with a very questionable ending.\"]":"assets/voices/days/days-theo-ch02-new-04-threeway.mp3","[\"Mira\",\"Good. I have several complaints.\"]":"assets/voices/days/days-mira-ch02-new-05-threeway.mp3","[\"Theo\",\"Had you already signed up for the cleanup before we met?\"]":"assets/voices/days/days-theo-ch02-new-06-threeway.mp3","[\"Mira\",\"I’m having mint tea. I think I’ll stick with that.\"]":"assets/voices/days/days-mira-ch02-new-07-threeway-review-v2.mp3","[\"Mira\",\"First the bookshop, now a bakery. Do all your shortcuts involve food?\"]":"assets/voices/days/days-mira-ch03-new-08-threeway.mp3","[\"Theo\",\"Only the good ones.\"]":"assets/voices/days/days-theo-ch03-new-09-threeway.mp3","[\"Theo\",\"I brought a spare umbrella. Do you need it?\"]":"assets/voices/days/days-theo-ch03-new-10-threeway.mp3","[\"Mira\",\"I remember playing this at the community center. I was always nervous about getting it wrong.\"]":"assets/voices/days/days-mira-ch04-new-11-threeway.mp3","[\"Theo\",\"I get nervous too. It helps when someone plays along.\"]":"assets/voices/days/days-theo-ch04-new-12-threeway.mp3","[\"Mira\",\"Will you take it slowly? I might need a moment to join in.\"]":"assets/voices/days/days-mira-ch04-new-13-threeway.mp3","[\"Mira\",\"Why next Saturday?\"]":"assets/voices/days/days-mira-ch05-new-14-threeway.mp3","[\"Mira\",\"You remembered that?\"]":"assets/voices/days/days-mira-ch05-new-15-threeway.mp3","[\"Mira\",\"And if I wanted us to stay friends?\"]":"assets/voices/days/days-mira-ch05-new-16-threeway.mp3","[\"Mira\",\"Even if that wasn’t the answer you hoped for?\"]":"assets/voices/days/days-mira-ch05-new-17-threeway.mp3"},"autoVoice":true,"characterSprites":{"mira":{"src":"assets/days-mira-idle-transparent-v2.png","columns":1,"rows":1,"frames":{"idle":"assets/days-mira-idle-transparent-v2.png","blink":"assets/days-mira-blink-transparent-v2.png","speaking":"assets/days-mira-speaking-transparent-v2.png","thoughtful":"assets/days-mira-thoughtful-transparent-v2.png"}},"theo":{"src":"assets/days-theo-idle-transparent-v2.png","columns":1,"rows":1,"frames":{"idle":"assets/days-theo-idle-transparent-v2.png","blink":"assets/days-theo-blink-aligned-transparent-v2.png","speaking":"assets/days-theo-speaking-conversational-transparent-v2.png","thoughtful":"assets/days-theo-thoughtful-transparent-v2.png"}}}}</script>
