k to Ward","icon":"☏","position":{"x":7,"y":45},"detail":"“I checked the manifest at departure,” Ward says. His eyes linger on the crossed-out name. “I cannot discuss the passenger’s assignment.”","note":"Ward’s guarded response","detailImage":"assets/train-ward-idle.png","detailImageWidth":1024,"detailImageHeight":1536,"conversationOnInspect":"ward"}],"characters":[{"id":"ward","name":"Elias Ward","role":"Conductor","bio":"The Nightingale Express conductor. Precise, protective, and carrying more responsibility than he admits.","intro":"Ask what you need. Please keep your questions away from the other passengers.","questions":[{"id":"q1","ask":"Why deny Nora was aboard?","reply":"Because her name on the manifest could put her in danger. She asked me to protect her assignment.","followUp":"Crossing out her seat made it look as though she never boarded.","followReply":"Yes. I thought secrecy would protect her. I did not expect her to leave the train."},{"id":"q2","ask":"What happened during the stop?","reply":"The emergency brake engaged at a red signal. Four minutes later, the line cleared.","followUp":"Could someone have stepped onto the junction platform?","followReply":"The carriage doors should have remained locked. “Should” is doing too much work tonight."},{"id":"q3","ask":"What was Nora investigating?","reply":"She would only say it concerned the Blackthorn bridge and an altered inspection report.","followUp":"Then her disappearance and the missing report are connected.","followReply":"That is what I fear. Find her before the next freight reaches that bridge."}]}],"puzzle":{"id":"train-seat","title":"Which seat was removed from the compartment chart?","type":"choice","prompt":"Which seat was removed from the compartment chart?","answer":"4C","success":"The documents agree: Nora Bell boarded and occupied 4C. Ward’s denial is deliberate, but why would he protect a missing passenger?","options":[{"id":"4A","label":"Seat 4A"},{"id":"4B","label":"Seat 4B"},{"id":"4 ne log reads: Northbridge 23:30; Ash Vale 23:48; BLK JCT 00:02; Briarford 00:41.","note":"Actual route log","detailImage":"assets/train-clue-log.png","detailImageWidth":1536,"detailImageHeight":1024},{"id":"mile","title":"Route display","icon":"⌁","position":{"x":75,"y":14},"detail":"The route display names Northbridge, Ash Vale, and Briarford. Its mileage scale puts Ash Vale at 18, an unnamed point at 26, and Briarford at 44. The engine log’s BLK JCT falls at that missing point.","note":"Junction mileposts","detailImage":"assets/train-clue-mile.png","detailImageWidth":1536,"detailImageHeight":1024},{"id":"signal","title":"Signal report","icon":"◉","position":{"x":68,"y":39},"detail":"The signal record reports a red aspect at Blackthorn Junction at 00:02, lasting four minutes.","note":"Red signal · 00:02","detailFrame":{"x":48,"y":19,"width":40,"height":40}},{"id":"tomas","title":"Talk to Tomas","icon":"☏","position":{"x":84,"y":34},"detail":"Engineer Tomas says, “Dispatch told me the signal was faulty. I stopped at the old junction because a red aspect is a red aspect.”","note":"Engineer’s account","detailImage":"assets/train-tomas-idle.png","detailImageWidth":1024,"detailImageHeight":1536,"conversationOnInspect":"tomas"}],"characters":[{"id":"tomas","name":"Tomas Reed","role":"Locomotive engineer","bio":"A practical railway engineer who treats every red signal as a warning worth respecting.","intro":"Dispatch called it a fault. I stopped because red still means stop.","questions":[{"id":"q1","ask":"Where exactly did we stop?","reply":"Blackthorn Junction, milepost twenty-six. It was removed from passenger timetables years ago.","followUp":"But it remains in the engine movement log.","followReply":"I know this much. The railway remembers places that printed maps prefer to forget."},{"id":"q2","ask":"Could Nora reach the tower?","reply":"From the rear platform, yes. There is a maintenance path beside the siding.","followUp":"Why would the carriage doors unlock?","fo delivered to railway investigators.","items":[{"id":"1","label":"1 · Align siding","image":"assets/train-clue-diagram.webp","imageAlt":"Signal diagram"},{"id":"2","label":"2 · Warn bridge","image":"assets/train-clue-diagram.webp","imageAlt":"Signal diagram"},{"id":"3","label":"3 · Stop main line","image":"assets/train-clue-diagram.webp","imageAlt":"Signal diagram"}],"presentation":{"mode":"timeline-clean","topLabel":"First action","bottomLabel":"Last action","layout":"card-slots","sideImage":"assets/train-ch5-tower.png","sideImageAlt":"The Last Platform","timelineTitle":"Your sequence","timelineDescription":"First action to last action","actions":[{"action":"check","label":"Check sequence"},{"action":"reset","label":"Reset arrangement"},{"action":"hint","label":"Progressive hint"},{"action":"close","label":"Return to investigation"}]}},"hints":["The emergency instruction states the safe order in words.","Stop the main line first, warn the bridge second, align the siding last.","Pull lever 3 → lever 2 → lever 1."],"clue":"The main line locks at danger. The freight train brakes before the bridge. Nora is freed, and the original safety report is delivered to railway investigators.","gate":{"allEvidence":["diagram","lever","report","nora","schedule"]},"endings":[{"id":"deliver","label":"The Report Delivered","text":"You and Nora place the original report directly into an investigator’s hands. Blackthorn Bridge closes before dawn."},{"id":"witness","label":"The Nightingale Testifies","text":"You remain with June, Tomas, Owen, and Ward until every statement is signed. Their accounts protect Nora’s report from being dismissed."}]}],"voiceMap":{"[\"Nora Bell\",\"I have the report. Stop the train first. Rescue me second.\"]":"assets/voices/05-tower-nora-introduction.mp3","[\"Nora Bell\",\"Only my pride. The door closed behind me, and the release wheel will not move.\"]":"assets/voices/05-tower-nora-q01-answer.mp3","[\"Nora Bell\",\"Good. The bridge matters more than one locked door.\"]":"assets/voices/05-tower-nora-q01-follow-up.mp3","[\"Nora Bell\",\"The bridge was declared unsafe pending repairs. Someone changed that conclusion before filing it.\"]":"assets/voices/05-tower-nora-q02-answer.mp3","[\"Nora Bell\",\"Every train since then has crossed under a false safety clearance. We can correct it tonight.\"]":"assets/voices/05-tower-nora-q02-follow-up.mp3","[\"Nora Bell\",\"Stop the main line, warn the bridge, then align the siding. The diagram numbers those actions three, two, one.\"]":"assets/voices/05-tower-nora-q03-answer.mp3","[\"Nora Bell\",\"Set them carefully. The mechanism will lock after the third lever.\"]":"assets/voices/05-tower-nora-q03-follow-up.mp3","[\"June Park\",\"Nora sat here alone, but she kept watching the service corridor clock.\"]":"assets/voices/02-dining-june-introduction.mp3","[\"June Park\",\"Her tea was served at 11:42. She left seven minutes later, just after checking a silver watch.\"]":"assets/voices/02-dining-june-q01-answer.mp3","[\"June Park\",\"Exactly. The water carafe arrived at 11:54, after her chair was already empty.\"]":"assets/voices/02-dining-june-q01-follow-up.mp3","[\"June Park\",\"A man in a tan travel coat passed her a folded note. They did not greet each other.\"]":"assets/voices/02-dining-june-q02-answer.mp3","[\"June Park\",\"I did not know his name, but he carried an old brass key on a blue ribbon.\"]":"assets/voices/02-dining-june-q02-follow-up.mp3","[\"June Park\",\"Not a person. A deadline. She asked how quickly someone could walk from carriage four to the rear platform.\"]":"assets/voices/02-dining-june-q03-answer.mp3","[\"June Park\",\"Or meet someone there. Either way, she planned around the timetable.\"]":"assets/voices/02-dining-june-q03-follow-up.mp3","[\"Tomas Reed\",\"Dispatch called it a fault. I stopped because red still means stop.\"]":"assets/voices/03-junction-tomas-introduction.mp3","[\"Tomas Reed\",\"Blackthorn Junction, milepost twenty-six. It was removed from passenger timetables years ago.\"]":"assets/voices/03-junction-tomas-q01-answer.mp3","[\"Tomas Reed\",\"I know this much. The railway remembers places that printed maps prefer to forget.\"]":"assets/voices/03-junction-tomas-q01-follow-up.mp3","[\"Tomas Reed\",\"From the rear platform, yes. There is a maintenance path beside the siding.\"]":"assets/voices/03-junction-tomas-q02-answer.mp3","[\"Tomas Reed\",\"A manual release was used. Only staff and someone with an old railway key would know it.\"]":"assets/voices/03-junction-tomas-q02-follow-up.mp3","[\"Tomas Reed\",\"After the bridge inspection dispute, passenger service stopped using the siding. Freight still crosses the bridge.\"]":"assets/voices/03-junction-tomas-q03-answer.mp3","[\"Tomas Reed\",\"The public report called it serviceable. I have never trusted that word.\"]":"assets/voices/03-junction-tomas-q03-follow-up.mp3","[\"Owen Hale\",\"My father kept the original report because someone changed his conclusion.\"]":"assets/voices/04-baggage-owen-introduction.mp3","[\"Owen Hale\",\"She promised to bring the report into daylight. My father died believing nobody had listened.\"]":"assets/voices/04-baggage-owen-q01-answer.mp3","[\"Owen Hale\",\"I trusted the evidence. Nora was the first person willing to follow it.\"]":"assets/voices/04-baggage-owen-q01-follow-up.mp3","[\"Owen Hale\",\"I moved a document case onto the maintenance trolley. The watch struck the rail and stopped.\"]":"assets/voices/04-baggage-owen-q02-answer.mp3","[\"Owen Hale\",\"Nora took the original records. The altered manifest was meant to hide the transfer.\"]":"assets/voices/04-baggage-owen-q02-follow-up.mp3","[\"Owen Hale\",\"No. The steel door swells in damp weather. I warned her not to let it close.\"]":"assets/voices/04-baggage-owen-q03-answer.mp3","[\"Owen Hale\",\"And the freight is due soon. We have to turn back now.\"]":"assets/voices/04-baggage-owen-q03-follow-up.mp3","[\"Elias Ward\",\"Ask what you need. Please keep your questions away from the other passengers.\"]":"assets/voices/01-carriage-elias-introduction.mp3","[\"Elias Ward\",\"Because her name on the manifest could put her in danger. She asked me to protect her assignment.\"]":"assets/voices/01-carriage-elias-q01-answer.mp3","[\"Elias Ward\",\"Yes. I thought secrecy would protect her. I did not expect her to leave the train.\"]":"assets/voices/01-carriage-elias-q01-follow-up.mp3","[\"Elias Ward\",\"The emergency brake engaged at a red signal. Four minutes later, the line cleared.\"]":"assets/voices/01-carriage-elias-q02-answer.mp3","[\"Elias Ward\",\"The carriage doors should have remained locked. “Should” is doing too much work tonight.\"]":"assets/voices/01-carriage-elias-q02-follow-up.mp3","[\"Elias Ward\",\"She would only say it concerned the Blackthorn bridge and an altered inspection report.\"]":"assets/voices/01-carriage-elias-q03-answer.mp3","[\"Elias Ward\",\"That is what I fear. Find her before the next freight reaches that bridge.\"]":"assets/voices/01-carriage-elias-q03-follow-up.mp3","[\"Elias Ward\",\"I protected Nora’s identity and nearly lost sight of her safety. I will answer for that.\"]":"assets/voices/05-tower-elias-introduction.mp3","[\"Elias Ward\",\"Yes. I altered the passenger copy of the manifest. I will explain why and accept the consequences.\"]":"assets/voices/05-tower-elias-q01-answer.mp3","[\"Elias Ward\",\"Including my mistake. Protection without trust can become another kind of silence.\"]":"assets/voices/05-tower-elias-q01-follow-up.mp3","[\"Elias Ward\",\"If we set the main-line signal now, it has enough braking distance.\"]":"assets/voices/05-tower-elias-q02-answer.mp3","[\"Elias Ward\",\"I will watch the track circuit. You take the levers.\"]":"assets/voices/05-tower-elias-q02-follow-up.mp3","[\"Elias Ward\",\"The bridge closes, investigators secure the report, and every maintenance record is reviewed.\"]":"assets/voices/05-tower-elias-q03-answer.mp3","[\"Elias Ward\",\"Published with evidence, witnesses, and no missing names.\"]":"assets/voices/05-tower-elias-q03-follow-up.mp3"},"resolution":{"title":"The bridge is safe","prompt":"The freight brakes before Blackthorn Bridge. Nora is freed with the original report in her hands. How will you secure the evidence?","finalNote":"Case complete · Nora is safe · Blackthorn Bridge is closed for repairs."},"pageAppearance":{"backgroundImage":"assets/story03-alpine-night-background.png","backgroundPosition":"center center","backdropTint":"#15243a22","palette":{"surface":"#fff9ee","ink":"#17241d","accent":"#214e3c","accentSoft":"#e6eee6","border":"#ddc9a7","muted":"#596057","gold":"#c4a466","headingInk":"#fffaf1","headingMuted":"#f4ead8"},"layout":{"contentWidth":1400,"sidebarPercent":30,"surfaceOpacity":0.96}}}</script>
