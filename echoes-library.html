hould restore it before treating it as a timeline of tonight."}]}],"puzzle":{"id":"library-books","title":"The Misplaced Books","type":"sequence","prompt":"Choose the four books connected to the Book Cart, arrange them on the shelf, then try the brass handles.","items":[{"id":"640","label":"Botanical Atlas"},{"id":"120","label":"The Book of Questions"},{"id":"810","label":"Collected Poetry"},{"id":"305","label":"Folklore of Willowmere"}],"answer":["120","305","640","810"],"presentation":{"mode":"bookshelf","shelfImage":"images/story02/library-bookshelf-seven-v1.png","spineSheetSize":{"width":1536,"height":1024},"slipText":"B–17","note":"Every volume has its proper place. Begin with the earliest entry, and let each number lead you forward. Only when the shelf is in order will it surrender what I have hidden. — Eleanor","cartNumbers":["640","120","810","305"],"candidates":[{"id":"120","label":"The Book of Questions","spineImage":"images/story02/book-covers-seven.png","spineFrame":{"x":23,"y":4,"width":350,"height":510},"coverImage":"images/story02/approved-open-120.png","color":"red"},{"id":"305","label":"Folklore of Willowmere","spineImage":"images/story02/book-covers-seven.png","spineFrame":{"x":402,"y":4,"width":353,"height":510},"coverImage":"images/story02/approved-open-305.png","color":"brown"},{"id":"640","label":"Botanical Atlas","spineImage":"images/story02/book-covers-seven.png","spineFrame":{"x":781,"y":4,"width":360,"height":510},"coverImage":"images/story02/approved-open-640.png","color":"green"},{"id":"810","label":"Collected Poetry","spineImage":"images/story02/book-covers-seven.png","spineFrame":{"x":1161,"y":4,"width":365,"height":510},"coverImage":"images/story02/approved-open-810.png","color":"blue"},{"id":"450","label":"Volume 450","spineImage":"images/story02/book-covers-seven.png","spineFrame":{"x":182,"y":534,"width":360,"height":486},"color":"purple"},{"id":"725","label":"Volume 725","spineImage":"images/story02/book-covers-seven.png","spineFra rary-audio","title":"Restore the Recording","type":"sequence","prompt":"Put the fragments in the order heard on the cylinder.","items":[{"id":"whisper","label":"Whispered title"},{"id":"chime","label":"Clock chime"},{"id":"steps","label":"Footsteps"}],"answer":["chime","steps","whisper"],"presentation":{"mode":"timeline"},"success":"The restored recording ends with a latch clicking open. Theo draws a rough map of the old west wing."},"gate":{"allEvidence":["player","transcript","latch","theo"]},"hints":["Listen for sounds that naturally happen one after another.","The chime comes first, then movement, then speech.","Arrange Clock chime → Footsteps → Whispered title."],"clue":"The restored recording ends with a latch clicking open. Theo draws a rough map of the old west wing."},{"id":"chapter-3","title":"The Restricted Archive","location":"The Restricted Archive","subtitle":"A shelf that should not exist.","scene":"assets/library-archive-painted.png","conversationBackdrop":{"size":"230% auto","position":"right center"},"intro":"Beyond a velvet rope, the archive smells of cedar and dust. Ada Vale, the senior archivist, meets you at the entrance. “My aunt Eleanor cataloged these shelves herself,” she says.","evidence":[{"id":"floorplan","title":"The Old Floor Plan","detail":"Compare the two west-wing plans. The original has a slim alcove immediately behind the sliding bookcase; the revised plan draws a wall across that space.","icon":"⌗","position":{"x":22,"y":66},"note":"Hidden west-wing alcove","detailImage":"assets/library-clue-floorplan.png","detailImageWidth":1536,"detailImageHeight":1024},{"id":"catalog","title":"The Catalog Drawer","detail":"The open B-series drawer ends at B-16. A loose correction card inside it reads “B-17 → behind sliding bookcase.”","icon":"▤","position":{"x":90,"y":51},"note":"B-17 catalog correction","detailImage":"assets/library-clue-catalog.png","detailImageWidth":1536,"detailImageHeight":1024},{"id":"bookcase","title":"The Sliding Bookcase","detail":"A small brass wheel under the bookcase sits beside fresh, short scuffs partly hidden by the rug. The case has moved sideways.","icon":"▥","position":{"x":67,"y":70},"note":"Bookcase wheel and scuffs","detailImage":"assets/library-clue-bookcase.webp","detailImageWidth":1672,"detailImageHeight":941},{"id":"ada","title":"Ada’s Account","conversationOnInspect":"ada","detail":"“Eleanor built the first collection, but the dedication only mentions the donor who supplied the building.”","icon":"☏","position":{"x":21,"y":45},"note":"Ada’s family account"}],"characters":[{"id":"ada","name":"Ada Vale","role":"The archivist","bio":"The senior archivist and Eleanor’s niece. Calm, wise and protective of the past.","intro":"Eleanor was my aunt. She cataloged these shelves long before the modern map was drawn. I have kept her papers, though I never knew how much was missing.","historical":false,"questions":[{"id":"q1","ask":"What did Eleanor do for the library?","reply":"She assembled the first collection. The dedication remembers the building’s donor, but says little about who filled its shelves.","followUp":"Can we verify her contribution?","followReply":"The original accession ledger and purchase receipts should let us do that. My memories alone are not enough."},{"id":"q2","ask":"Where is B-17?","reply":"The public map stops at B-16. The handwritten correction points beyond the sliding bookcase.","followUp":"The floor marks suggest it can move.","followReply":"Then compare the old plan and the catalog slip. Do not force it until you know which shelf to open."},{"id":"q3","ask":"Why keep her papers private?","reply":"I wanted to protect them from another hurried renovation. I also feared people would dismiss a family claim.","followUp":"We can present the records with their context.","followReply":"Thank you. Recognition should come from evidence, not from how loudly we ask."}]}],"puzzle":{"id":"library-shelf","title":"Find the Missing Shelf","type":"choice","prom ilImageWidth":1536,"detailImageHeight":1024},{"id":"ruler","title":"The Brass Ruler","detail":"The ruler lies across sketches of the landmarks that do not change between the two plans. Read the labels beneath it from left to right, then compare those landmarks on the original and revised drawings. What occupies the former west alcove?","icon":"⌁","position":{"x":26,"y":77},"note":"Shared landmarks","detailImage":"assets/library-clue-ruler.png","detailImageWidth":1536,"detailImageHeight":1024},{"id":"theo2","title":"Theo’s Admission","conversationOnInspect":"theo","detailFrame":{"x":51,"y":5,"width":35,"height":67},"detail":"“I wanted to stop the wall being sealed. Hiding the plans was wrong, but the room is real.”","icon":"☏","position":{"x":72,"y":38},"note":"Theo’s admission"}],"characters":[{"id":"theo","name":"Theo Mercer","role":"The book conservator","bio":"A skilled conservator with a playful personality and an eye for detail.","intro":"I hid the revised plans. They were going to seal the room before anyone inspected it. I wanted to protect the books, but keeping quiet was wrong.","historical":false,"questions":[{"id":"q1","ask":"Why did you hide the plans?","reply":"The new wall would have closed the old alcove. I panicked and thought delaying the work was the only way to save it.","followUp":"You could have asked for an inspection.","followReply":"I know. I will give Evelyn both plans and explain what I did."},{"id":"q2","ask":"How do we align the drawings?","reply":"Use permanent features: the west window, central pillar and original staircase. They survive on both plans.","followUp":"That should reveal the covered space.","followReply":"Yes. Set those three landmarks in that order; the wall outline will stop misleading us."},{"id":"q3","ask":"What should we restore first?","reply":"The damaged manuscript needs a stable surface and careful documentation before any repair.","followUp":"We should preserve the original marks.","followReply":"Absolutely. A clean-looking page is no improvement if it erases the evidence."}]}],"puzzle":{"id":"library-blueprint","title":"Compare the Drawings","type":"sequence","prompt":"Use the arrows to put the shared landmarks in the left-to-right order shown beneath the brass ruler.","items":[{"id":"stairs","label":"Original staircase"},{"id":"window","label":"West window"},{"id":"pillar","label":"Central pillar"}],"answer":["window","pillar","stairs"],"presentation":{"mode":"timeline"},"success":"Comparing the shared landmarks reveals a hidden chamber behind the revised west wall. Evelyn retrieves the original key from the restoration safe."},"gate":{"allEvidence":["original","modern","ruler","theo2"]},"hints":["Both drawings show the same three permanent architectural features.","Read their labels from left to right beneath the brass ruler.","Choose Window → Pillar → Staircase."],"clue":"Comparing the shared landmarks reveals a hidden chamber behind the revised west wall. Evelyn retrieves the original key from the restoration safe."},{"id":"chapter-5","title":"The Last Chapter","location":"The Last Chapter","subtitle":"History is more than the names carved in stone.","scene":"assets/library-chamber-painted.png","intro":"The hidden chamber holds a handwritten manuscript, donor receipts, and a photograph of the first reading room. Dust covers everything except a small cedar chest.","evidence":[{"id":"manuscript","title":"The Handwritten Manuscript","detail":"The title page reads: “A Library for Everyone.” Its looping E and sharp V form the signature E. Vale.","icon":"▥","position":{"x":32,"y":74},"note":"Eleanor’s manuscript","detailImage":"assets/library-clue-manuscript.webp","detailImageWidth":1672,"detailImageHeight":941},{"id":"receipts","title":"The Donor Receipts","detail":"The receipts document purchases for the first collection. They bear the same looping E and sharp V, signed E. Vale.","icon":"▤","position":{"x":43,"y":81},"note":"Founding receipts","detailImage":"assets/library-clue-receipts.webp","detailImageWidth":1672,"detailImageHeight":941},{"id":"photo","title":"The Founding Photograph","detail":"The framed photograph on the desk shows Eleanor holding a book from the first collection. It is the same photograph you can see in the room.","icon":"▧","position":{"x":9,"y":70},"note":"Original founding photograph"},{"id":"ledger","title":"The Founding Ledger","detail":"The opening page lists the first four collection entries. Each is recorded by E. Vale, and the full signature at the bottom reads “Eleanor Vale.” Compare that signature with the manuscript and receipts.","icon":"✎","position":{"x":59,"y":86},"note":"Founding catalog ledger","detailImage":"assets/library-clue-ledger.png","detailImageWidth":1536,"detailImageHeight":1024}],"characters":[{"id":"ada","name":"Ada Vale","role":"The archivist","bio":"The senior archivist and Eleanor’s niece. Calm, wise and protective of the past.","intro":"These are Eleanor’s words at last. The looping E and sharp V appear on the manuscript, receipts and first catalog ledger. Let us compare them carefully.","historical":false,"questions":[{"id":"q1","ask":"Do the signatures prove the author?","reply":"The manuscript says E. Vale. The full signature in the founding ledger connects those initials to Eleanor Vale, with the same distinctive handwriting.","followUp":"And the receipts corroborate her role.","followReply":"Yes. Together they show authorship, purchases and the work of building the first collection."},{"id":"q2","ask":"What does recognition mean to you?","reply":"It means her story can be read in its proper place. I do not want to replace one incomplete dedication with another.","followUp":"We should retain the building donor’s contribution too.","followReply":"Exactly. There is room in the history for everyone who helped."}]},{"id":"eleanor","name":"Eleanor Vale","role":"The forgotten author","bio":"Her story lives through letters, recordings and the archives she left behind.","intro":"You anor’s opening page at the exhibition. Visitors can see the manuscript and the records beside it."},{"id":"trustees","label":"The trustees’ review","text":"The trustees verify the manuscript and founding records, then approve an exhibition and a corrected dedication."}]}],"legacyPage":"echoes-library.html","voiceMap":{"[\"Evelyn Hart\",\"Welcome to Willowmere. I found this damaged music box in the returns cupboard. The voice inside asks us to look where the first stories were kept. Will you help me follow it?\"]":"assets/voices/01-reading-evelyn-introduction.mp3","[\"You\",\"Who was Eleanor Vale?\"]":"assets/voices/01-reading-player-q01-evelyn-question.mp3","[\"Evelyn Hart\",\"Her name appears on the staff photograph, but not in our public dedication. That difference deserves a careful look.\"]":"assets/voices/01-reading-evelyn-q01-answer.mp3","[\"You\",\"So an omission is a lead, not proof?\"]":"assets/voices/01-reading-player-q01-evelyn-follow-up.mp3","[\"Evelyn Hart\",\"Exactly. Let the records tell us what happened before we decide why.\"]":"assets/voices/01-reading-evelyn-q01-follow-up.mp3","[\"You\",\"What is missing from the catalog?\"]":"assets/voices/01-reading-player-q02-evelyn-question.mp3","[\"Evelyn Hart\",\"Someone scratched out an accession entry. The books on the cart may still hold the original shelf reference.\"]":"assets/voices/01-reading-evelyn-q02-answer.mp3","[\"You\",\"I will compare the catalog stamps.\"]":"assets/voices/01-reading-player-q02-evelyn-follow-up.mp3","[\"Evelyn Hart\",\"Try arranging them from the smallest number to the largest. Look inside the final book.\"]":"assets/voices/01-reading-evelyn-q02-follow-up.mp3","[\"You\",\"Why does the clock matter?\"]":"assets/voices/01-reading-player-q03-evelyn-question.mp3","[\"Evelyn Hart\",\"The wall clock stopped at 9:15, but the recording has three full chimes. Those are different observations.\"]":"assets/voices/01-reading-evelyn-q03-answer.mp3","[\"You\",\"The recording may belong to another time.\"]":"assets/voices/01-reading-player-q03-evelyn-follow-up.mp3","[\"Evelyn Hart\",\"Yes. We should restore it before treating it as a timeline of tonight.\"]":"assets/voices/01-reading-evelyn-q03-follow-up.mp3","[\"Theo Mercer\",\"This listening room still has its original equipment. I can repair the mechanism, but you will need to put the surviving fragments in order.\"]":"assets/voices/02-listening-theo-introduction.mp3","[\"You\",\"Where did the recording come from?\"]":"assets/voices/02-listening-player-q01-theo-question.mp3","[\"Theo Mercer\",\"Behind a wall panel during the west-wing renovation. I thought it was music until I heard the voice.\"]":"assets/voices/02-listening-theo-q01-answer.mp3","[\"You\",\"Did you tell Evelyn?\"]":"assets/voices/02-listening-player-q01-theo-follow-up.mp3","[\"Theo Mercer\",\"I brought her the music box. I should also have told her exactly where it was found.\"]":"assets/voices/02-listening-theo-q01-follow-up.mp3","[\"You\",\"What is the metallic click?\"]":"assets/voices/02-listening-player-q02-theo-question.mp3","[\"Theo Mercer\",\"An old west-wing latch. New doors have a different mechanism; I have repaired enough of both to recognize it.\"]":"assets/voices/02-listening-theo-q02-answer.mp3","[\"You\",\"Then the voice is pointing to a physical place.\"]":"assets/voices/02-listening-player-q02-theo-follow-up.mp3","[\"Theo Mercer\",\"That is a reasonable lead. Compare the sound with the old plans instead of guessing.\"]":"assets/voices/02-listening-theo-q02-follow-up.mp3","[\"You\",\"How do we order the fragments?\"]":"assets/voices/02-listening-player-q03-theo-question.mp3","[\"Theo Mercer\",\"First comes the clock chime, then footsteps, then the whispered title. The background sounds join at the damaged edges.\"]":"assets/voices/02-listening-theo-q03-answer.mp3","[\"You\",\"I will reconstruct that sequence.\"]":"assets/voices/02-listening-player-q03-theo-follow-up.mp3","[\"Theo Mercer\",\"Once they line up, the final latch sound should be clear.\"]":"assets/voices/02-listening-theo-q03-follow-up.mp3","[\"Ada Vale\",\"Eleanor was my aunt. She cataloged these shelves long before the modern map was drawn. I have kept her papers, though I never knew how much was missing.\"]":"assets/voices/03-archive-ada-introduction.mp3","[\"You\",\"What did Eleanor do for the library?\"]":"assets/voices/03-archive-player-q01-ada-question.mp3","[\"Ada Vale\",\"She assembled the first collection. The dedication remembers the building’s donor, but says little about who filled its shelves.\"]":"assets/voices/03-archive-ada-q01-answer.mp3","[\"You\",\"Can we verify her contribution?\"]":"assets/voices/03-archive-player-q01-ada-follow-up.mp3","[\"Ada Vale\",\"The original accession ledger and purchase receipts should let us do that. My memories alone are not enough.\"]":"assets/voices/03-archive-ada-q01-follow-up.mp3","[\"You\",\"Where is B-17?\"]":"assets/voices/03-archive-player-q02-ada-question.mp3","[\"Ada Vale\",\"The public map stops at B-16. The handwritten correction points beyond the sliding bookcase.\"]":"assets/voices/03-archive-ada-q02-answer.mp3","[\"You\",\"The floor marks suggest it can move.\"]":"assets/voices/03-archive-player-q02-ada-follow-up.mp3","[\"Ada Vale\",\"Then compare the old plan and the catalog slip. Do not force it until you know which shelf to open.\"]":"assets/voices/03-archive-ada-q02-follow-up.mp3","[\"You\",\"Why keep her papers private?\"]":"assets/voices/03-archive-player-q03-ada-question.mp3","[\"Ada Vale\",\"I wanted to protect them from another hurried renovation. I also feared people would dismiss a family claim.\"]":"assets/voices/03-archive-ada-q03-answer.mp3","[\"You\",\"We can present the records with their context.\"]":"assets/voices/03-archive-player-q03-ada-follow-up.mp3","[\"Ada Vale\",\"Thank you. Recognition should come from evidence, not from how loudly we ask.\"]":"assets/voices/03-archive-ada-q03-follow-up.mp3","[\"Theo Mercer\",\"I hid the revised plans. They were going to seal the room before anyone inspected it. I wanted to protect the books, but keeping quiet was wrong.\"]":"assets/voices/04-workshop-theo-introduction.mp3","[\"You\",\"Why did you hide the plans?\"]":"assets/voices/04-workshop-player-q01-theo-question.mp3","[\"Theo Mercer\",\"The new wall would have closed the old alcove. I panicked and thought delaying the work was the only way to save it.\"]":"assets/voices/04-workshop-theo-q01-answer.mp3","[\"You\",\"You could have asked for an inspection.\"]":"assets/voices/04-workshop-player-q01-theo-follow-up.mp3","[\"Theo Mercer\",\"I know. I will give Evelyn both plans and explain what I did.\"]":"assets/voices/04-workshop-theo-q01-follow-up.mp3","[\"You\",\"How do we align the drawings?\"]":"assets/voices/04-workshop-player-q02-theo-question.mp3","[\"Theo Mercer\",\"Use permanent features: the west window, central pillar and original staircase. They survive on both plans.\"]":"assets/voices/04-workshop-theo-q02-answer.mp3","[\"You\",\"That should reveal the covered space.\"]":"assets/voices/04-workshop-player-q02-theo-follow-up.mp3","[\"Theo Mercer\",\"Yes. Set those three landmarks in that order; the wall outline will stop misleading us.\"]":"assets/voices/04-workshop-theo-q02-follow-up.mp3","[\"You\",\"What should we restore first?\"]":"assets/voices/04-workshop-player-q03-theo-question.mp3","[\"Theo Mercer\",\"The damaged manuscript needs a stable surface and careful documentation before any repair.\"]":"assets/voices/04-workshop-theo-q03-answer.mp3","[\"You\",\"We should preserve the original marks.\"]":"assets/voices/04-workshop-player-q03-theo-follow-up.mp3","[\"Theo Mercer\",\"Absolutely. A clean-looking page is no improvement if it erases the evidence.\"]":"assets/voices/04-workshop-theo-q03-follow-up.mp3","[\"Ada Vale\",\"These are Eleanor’s words at last. The looping E and sharp V appear on the manuscript, receipts and first catalog ledger. Let us compare them carefully.\"]":"assets/voices/05-final-ada-introduction.mp3","[\"You\",\"Do the signatures prove the author?\"]":"assets/voices/05-final-player-q01-ada-question.mp3","[\"Ada Vale\",\"The manuscript says E. Vale. The full signature in the founding ledger connects those initials to Eleanor Vale, with the same distinctive handwriting.\"]":"assets/voices/05-final-ada-q01-answer.mp3","[\"You\",\"And the receipts corroborate her role.\"]":"assets/voices/05-final-player-q01-ada-follow-up.mp3","[\"Ada Vale\",\"Yes. Together they show authorship, purchases and the work of building the first collection.\"]":"assets/voices/05-final-ada-q01-follow-up.mp3","[\"You\",\"What does recognition mean to you?\"]":"assets/voices/05-final-player-q02-ada-question.mp3","[\"Ada Vale\",\"It means her story can be read in its proper place. I do not want to replace one incomplete dedication with another.\"]":"assets/voices/05-final-ada-q02-answer.mp3","[\"You\",\"We should retain the building donor’s contribution too.\"]":"assets/voices/05-final-player-q02-ada-follow-up.mp3","[\"Ada Vale\",\"Exactly. There is room in the history for everyone who helped.\"]":"assets/voices/05-final-ada-q02-follow-up.mp3","[\"Eleanor’s manuscript\",\"You open Eleanor’s manuscript. This is a recollection through her written words, not a conversation with someone living. “A library begins when a story finds someone who needs it.”\"]":"assets/voices/05-final-eleanor-introduction.mp3","[\"You\",\"Read the manuscript’s opening\"]":"assets/voices/05-final-player-q01-eleanor-question.mp3","[\"Eleanor’s manuscript\",\"“I have gathered books for the curious child, the tired worker, and anyone who has been told a story is not for them.”\"]":"assets/voices/05-final-eleanor-q01-answer.mp3","[\"You\",\"She imagined a library open to everyone.\"]":"assets/voices/05-final-player-q01-eleanor-follow-up.mp3","[\"Eleanor’s manuscript\",\"“A shelf is only wood until we make room beside it.”\"]":"assets/voices/05-final-eleanor-q01-follow-up.mp3","[\"You\",\"Read her note about recognition\"]":"assets/voices/05-final-player-q02-eleanor-question.mp3","[\"Eleanor’s manuscript\",\"“If my name is lost, let the books remain. Yet I hope whoever comes after us will tell the whole story.”\"]":"assets/voices/05-final-eleanor-q02-answer.mp3","[\"You\",\"Preserving her work includes preserving its history.\"]":"assets/voices/05-final-player-q02-eleanor-follow-up.mp3","[\"Eleanor’s manuscript\",\"“Leave a record of whose hands carried these pages. The next reader deserves the truth.”\"]":"assets/voices/05-final-eleanor-q02-follow-up.mp3","[\"Ada Vale\",\"The manuscript, receipts and founding catalog agree. Eleanor wrote this work and helped assemble and finance the first collection.\"]":"assets/voices/05-final-ada-reveal-01.mp3","[\"You\",\"The donor supplied the building. Eleanor’s contribution can be recognized alongside that history.\"]":"assets/voices/05-final-player-reveal-02.mp3","[\"Ada Vale\",\"That is all I hoped for: the whole story, preserved with the evidence.\"]":"assets/voices/05-final-ada-reveal-03.mp3","[\"You\",\"Theo’s hidden plans delayed the renovation, but the documents—not his secrecy—establish Eleanor’s work.\"]":"assets/voices/05-final-player-reveal-04.mp3","[\"Ada Vale\",\"He has explained his mistake to Evelyn. We can protect the chamber and still be honest about how we found it.\"]":"assets/voices/05-final-ada-reveal-05.mp3","[\"Ada Vale\",\"Shall we open a public exhibition now, or present the evidence to the trustees first?\"]":"assets/voices/05-final-ada-reveal-06.mp3"}}</script>
