assets/days-mira-blink-transparent-v2.png","speaking":"assets/days-mira-speaking-transparent-v2.png","thoughtful":"assets/days-mira-thoughtful-transparent-v2.png"}},"theo":{"src":"assets/days-theo-idle-transparent-v2.png","columns":1,"rows":1,"frames":{"idle":"assets/days-theo-idle-transparent-v2.png","blink":"assets/days-theo-blink-aligned-transparent-v2.png","speaking":"assets/days-theo-speaking-conversational-transparent-v2.png","thoughtful":"assets/days-theo-thoughtful-transparent-v2.png"}}},"conversationScript":[{"opening":[{"speaker":"you","to":null,"text":"Everyone all right? That book made quite an entrance."},{"speaker":"mira","to":"you","text":"I keep telling myself this bag is big enough for one more book."},{"speaker":"theo","to":"mira","text":"The reading table starts at eleven. You would be welcome there."},{"speaker":"mira","to":"theo","text":"Thanks for helping. Not exactly the first impression I was hoping for."},{"speaker":"theo","to":"mira","text":"For what it’s worth, I was hoping for a reason to say hello."}],"topics":[{"id":"ch1-topic1","focus":"mira","label":"The dropped book and inscription","lines":[{"speaker":"you","to":"mira","text":"Did the book get damaged?"},{"speaker":"mira","to":"you","text":"A bent corner. I think it will survive."},{"speaker":"you","to":"mira","text":"When did you write that note inside the cover?"},{"speaker":"mira","to":"you","text":"Years ago. I wanted to remember that a place can feel like home."}]},{"id":"ch1-topic2","focus":"mira","label":"Joining the reading table","lines":[{"speaker":"you","to":"mira","text":"Would you like to join the reading table?"},{"speaker":"mira","to":"you","text":"I came for coffee, but a chapter sounds nice."},{"speaker":"you","to":"mira","text":"Does knowing you can leave after one chapter make it easier?"},{"speaker":"mira","to":"you","text":"That makes staying feel much easier."}]},{"id":"ch1-topic3","focus":"theo","label":"Volunteering at the bookshop","lines":[{"speaker":"you","to":"theo","text":"Do you volunteer here often?"},{"speaker":"theo","to":"you","text":"Most Sundays. Books are a good excuse to meet the neighbors."},{"speaker":"you","to":"theo","text":"Is the reading table a formal event?"},{"speaker":"theo","to":"you","text":"Only if you count debating the ending over coffee."}]},{"id":"ch1-topic4","focus":"theo","label":"Finding the reading table","lines":[{"speaker":"you","to":"theo","text":"Where is the reading table?"},{"speaker":"theo","to":"you","text":"Just inside, beside the window."},{"speaker":"mira","to":"theo","text":"Would it be all right if I stayed for just one chapter?"},{"speaker":"theo","to":"mira","text":"One chapter is a very good start."}]}]},{"opening":[{"speaker":"you","to":null,"text":"You both made it back. How is the reading table going?"},{"speaker":"mira","to":"theo","text":"I came back for the books. Seeing you again is a lovely bonus."},{"speaker":"theo","to":"you","text":"I like an ending that leaves room for both people to choose."},{"speaker":"theo","to":"mira","text":"I was hoping you’d come back. You left me with a very questionable ending."},{"speaker":"mira","to":"theo","text":"Good. I have several complaints."}],"topics":[{"id":"ch2-topic1","focus":"mira","label":"Sorting the returned books","lines":[{"speaker":"you","to":"mira","text":"What would help us put these books in order?"},{"speaker":"mira","to":"you","text":"The shelf numbers look like the answer."},{"speaker":"you","to":"mira","text":"So poems, travel, then gardens?"},{"speaker":"mira","to":"you","text":"Exactly. The little things are easier together."}]},{"id":"ch2-topic2","focus":"mira","label":"The cleanup plans","lines":[{"speaker":"theo","to":"mira","text":"Had you already signed up for the cleanup before we met?"},{"speaker":"mira","to":"theo","text":"I signed up before I knew you might be there."},{"speaker":"you","to":"mira","text":"Do you feel obliged to go because Theo will be there?"},{"speaker":"mira","to":"you","text":"I do not. That is why I can say yes."}]},{"id":"ch2-topic3","focus":"theo","label":"Theo’s margin note","lines":[{"speaker":"you","to":"theo","text":"What bothered you about that ending?"},{"speaker":"theo","to":"you","text":"Too many stories mistake a grand gesture for listening."},{"speaker":"you","to":"theo","text":"What would you rather see someone do?"},{"speaker":"theo","to":"you","text":"Ask a question, and hear the answer."}]},{"id":"ch2-topic4","focus":"theo","label":"Coffee and mint tea","lines":[{"speaker":"you","to":null,"text":"What are you both drinking?"},{"speaker":"theo","to":"you","text":"Black coffee. I should probably switch to tea."},{"speaker":"mira","to":"you","text":"I’m having mint tea. I think I’ll stick with that."},{"speaker":"theo","to":"mira","text":"Then we have found a perfectly balanced table."}]}]},{"opening":[{"speaker":"you","to":null,"text":"Are you two still heading to the garden?"},{"speaker":"mira","to":"you","text":"The rain changed my route. I would still like to make the cleanup."},{"speaker":"theo","to":"mira","text":"Market Street is still open. We can take the short way, if you want company."},{"speaker":"mira","to":"theo","text":"First the bookshop, now a bakery. Do all your shortcuts involve food?"},{"speaker":"theo","to":"mira","text":"Only the good ones."}],"topics":[{"id":"ch3-topic1","focus":"mira","label":"The route to the garden","lines":[{"speaker":"you","to":"mira","text":"Which way can we get to the garden?"},{"speaker":"mira","to":"you","text":"The canal path is closed. The poster points to Market Street."},{"speaker":"you","to":"mira","text":"Do we still have time to get there?"},{"speaker":"mira","to":"you","text":"The bakery clock says two fifteen. We do."}]},{"id":"ch3-topic2","focus":"mira","label":"Umbrellas and company","lines":[{"speaker":"theo","to":"mira","text":"I brought a spare umbrella. Do you need it?"},{"speaker":"mira","to":"theo","text":"That is kind, but I brought one."},{"speaker":"you","to":"mira","text":"Would you still like to walk with Theo?"},{"speaker":"mira","to":"you","text":"Yes. That I would like."}]},{"id":"ch3-topic3","focus":"theo","label":"The closed paths","lines":[{"speaker":"you","to":"theo","text":"Why can’t we take Canal Walk?"},{"speaker":"theo","to":"you","text":"The council closed it until Monday."},{"speaker":"you","to":"theo","text":"Would Bridge Road work instead?"},{"speaker":"theo","to":"you","text":"Open, but far longer. We would miss the start."}]},{"id":"ch3-topic4","focus":"theo","label":"Time for the cleanup","lines":[{"speaker":"you","to":"theo","text":"Are we running late for the cleanup?"},{"speaker":"theo","to":"you","text":"Not yet. The cleanup begins at three."},{"speaker":"you","to":"theo","text":"Do we need to hurry on the way?"},{"speaker":"theo","to":"you","text":"No rush. We have fifteen minutes to walk."}]}]},{"opening":[{"speaker":"mira","to":"theo","text":"I know that melody. We used to play it at the community center."},{"speaker":"theo","to":"mira","text":"I practiced this for the fundraiser. I did not know you knew it too."},{"speaker":"mira","to":"theo","text":"I remember playing this at the community center. I was always nervous about getting it wrong."},{"speaker":"theo","to":"mira","text":"I get nervous too. It helps when someone plays along."}],"topics":[{"id":"ch4-topic1","focus":"mira","label":"Playing the melody together","lines":[{"speaker":"you","to":"mira","text":"Do you remember the opening notes?"},{"speaker":"mira","to":"you","text":"The opening notes: C, E, G, E."},{"speaker":"you","to":"mira","text":"Would you like to play it with Theo?"},{"speaker":"mira","to":"you","text":"Only if we can laugh when I miss a note."}]},{"id":"ch4-topic2","focus":"mira","label":"The community photograph","lines":[{"speaker":"you","to":"mira","text":"Does the photograph show you were in the same community group?"},{"speaker":"mira","to":"you","text":"Yes. I did not notice we were both in the same community group."},{"speaker":"you","to":"mira","text":"So you nearly met then?"},{"speaker":"mira","to":"you","text":"Almost. I like that we met when we could actually talk."}]},{"id":"ch4-topic3","focus":"theo","label":"Starting at the piano","lines":[{"speaker":"you","to":"theo","text":"Theo, which notes would get us started?"},{"speaker":"theo","to":"you","text":"C, E, G, E. The tune comes back once you start."},{"speaker":"mira","to":"theo","text":"Will you take it slowly? I might need a moment to join in."},{"speaker":"theo","to":"mira","text":"I will. You can join whenever you feel ready."}]},{"id":"ch4-topic4","focus":"theo","label":"Their earlier almost-meeting","lines":[{"speaker":"you","to":"theo","text":"Do you remember being in the same room as Mira?"},{"speaker":"theo","to":"you","text":"I think we were in the same room, years ago."},{"speaker":"you","to":"theo","text":"What would you like to happen after all these almost-meetings?"},{"speaker":"theo","to":"you","text":"Maybe we should write the next verse ourselves."}]}]},{"opening":[{"speaker":"theo","to":"mira","text":"Would you like to meet again next Saturday? Coffee, if that sounds good to you."},{"speaker":"mira","to":"theo","text":"I have time next Saturday. I want to decide what that means together."},{"speaker":"mira","to":"theo","text":"Why next Saturday?"},{"speaker":"theo","to":"mira","text":"You said you are free after four. I remembered."},{"speaker":"mira","to":"theo","text":"You remembered that?"},{"speaker":"theo","to":"mira","text":"Yeah. I was hoping I’d get to see you again."}],"topics":[{"id":"ch5-topic1","focus":"mira","label":"The invitation","lines":[{"speaker":"you","to":"mira","text":"What matters to you about the way Theo asks?"},{"speaker":"mira","to":"you","text":"An honest invitation, and room to answer honestly."},{"speaker":"you","to":"mira","text":"Would coffee at four thirty suit you?"},{"speaker":"mira","to":"you","text":"That sounds like something I can choose."}]},{"id":"ch5-topic2","focus":"mira","label":"Choosing friendship","lines":[{"speaker":"you","to":"mira","text":"Would friendship be a good outcome for you, too?"},{"speaker":"mira","to":"you","text":"Of course. That is a real choice too."},{"speaker":"you","to":"mira","text":"Would choosing friendship mean losing what you already share?"},{"speaker":"mira","to":"you","text":"No. We already have books and the garden."}]},{"id":"ch5-topic3","focus":"theo","label":"If Mira wants to stay friends","lines":[{"speaker":"mira","to":"theo","text":"And if I wanted us to stay friends?"},{"speaker":"theo","to":"mira","text":"Then we keep our reading table and our garden Saturdays."},{"speaker":"mira","to":"theo","text":"Even if that wasn’t the answer you hoped for?"},{"speaker":"theo","to":"mira","text":"I do. Your answer matters more than my plan."}]}]}]}</script>
