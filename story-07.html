ndings. Her maps are still useful to the crew.","followUp":"Where can we check those drawings?","followReply":"The archive keeps the old maintenance papers. I can help you find the right cabinet there.","availableWhen":{"always":true}}]},{"id":"jonah","name":"Jonah Reed","role":"Clockmaker’s apprentice","bio":"A quick-handed apprentice who knows every sound the tower mechanism can make.","initials":"JR","questions":[{"id":"tool","ask":"Is the empty tool slot unusual?","reply":"Tools are taken out for ordinary repairs. What catches my eye is the clean outline in otherwise settled dust.","followUp":"Can you identify which tool is missing?","followReply":"A narrow brass lifter. Let us find it before deciding what anyone used it for.","availableWhen":{"always":true}},{"id":"hatch","ask":"How is the tower normally serviced?","reply":"Through a small hatch above the stairs. The crew uses it to reach the regulator without removing the dial.","followUp":"Who is allowed to use that access?","followReply":"The clockmaker and the maintenance crew. It is a working entrance, not a private room.","availableWhen":{"always":true}}]},{"id":"biscuit","name":"Biscuit","role":"Elias’s golden retriever · your sidekick","bio":"Affectionate, curious, and exceptionally good at noticing scents people overlook.","initials":"🐾","companion":true,"questions":[]}],"puzzle":{"id":"workshop-sequence","type":"sequence","title":"Set the clock safely","prompt":"Put the repair steps in the order Elias taught his apprentices.","items":[{"id":"spring","label":"Wind the mainspring","caption":"Restore steady tension.","image":"assets/story07/workshop.png","imageAlt":"The Clockmaker’s Workshop"},{"id":"escapement","label":"Free the escapement","caption":"Release the locked wheel.","image":"assets/story07/workshop.png","imageAlt":"The Clockmaker’s Workshop"},{"id":"pendulum","label":"Restart the pendulum","caption":"Let the clock keep time.","image":"assets/story07/workshop.png","imageAlt":"The Clockmaker’s Workshop"}],"answer":["spring","escapement","pendulum"],"presentation":{"mode":"timeline-clean","layout":"card-slots","sideImage":"assets/story07/workshop.png","sideImageAlt":"The Clockmaker’s Workshop","timelineTitle":"Your sequence","timelineDescription":"First to last","actions":[{"action":"check","label":"Check sequence"},{"action":"reset","label":"Reset arrangement"},{"action":"hint","label":"Progressive hint"},{"action":"close","label":"Return to investigation"}]}},"gate":{"allEvidence":["stopped-watch","paired-tools","biscuit-tag"],"allDialogue":["workshop:clockmaker:minute","workshop:clockmaker:promise","workshop:lena:ledger","workshop:lena:mara","workshop:jonah:tool","workshop:jonah:hatch"]},"hints":["Compare the stopped watch with the empty tool slot before assuming a cause.","The watch and tower both stopped at the same minute.","Look for evidence that someone opened the mechanism recently."],"clue":"The watch stopped at 11:47 and has been handled recently. A narrow tool is missing, but its use and user are still unknown.","success":"The evidence reveals a new lead. Biscuit is ready to follow it.","companionSearch":{"targets":["stopped-watch","paired-tools","biscuit-tag"],"searchMessage":"Biscuit is sniffing around the scene…","foundMessage":"Biscuit found a clue! Take a closer look.","emptyMessage":"Biscuit has searched the reachable corners. Examine any remaining scene markers."},"companionFloor":{"left":0.08,"right":0.82,"top":0.72,"bottom":0.96}},{"id":"forgotten-hour","title":"The Forgotten Hour","location":"The Forgotten Hour","subtitle":"The town records have a blank where the hour should be.","scene":"assets/story07/forgotten-hour-hd.png","intro":"The archive keeps the official record of every public clock adjustment. A page has been removed from the night the town clock stopped, though the binding is undisturbed.","evidence":[{"id":"archive-gap","title":"The missing ledger leaf","icon":"▤","position":{"x":30,"y":38},"markerPosition":{"x":30,"y":43},"detail":"The ledger’s binding is intact, but a single leaf was cut cleanly from the 11 o’clock section.","note":"One leaf removed from the 11 o’clock record."},{"id":"repair-note","title":"The private repair note","icon":"✎","position":{"x":72,"y":44},"markerPosition":{"x":72,"y":49},"detail":"An unsigned service slip reads: “11:47 · inspect regulator before resetting.” Its upper edge is torn through the space where a name or date might have been.","note":"An unsigned service slip records 11:47; its author is unknown."},{"id":"archive-stamp","title":"The night register stamp","icon":"▣","position":{"x":53,"y":77},"markerPosition":{"x":53,"y":82},"detail":"The archive stamp places the ledger in the reading room at 11:20. The entry for the later hour was added after the binder had been closed.","note":"The clock record was amended after closing."}],"characters":[{"id":"clockmaker","name":"Elias Bell","role":"Clockmaker","bio":"Patient and precise. Since his partner Mara died, Elias has grown quieter and more protective of the town clock.","initials":"EB","questions":[{"id":"route","ask":"Do you recognise this unsigned repair note?","reply":"It uses the shorthand we keep on service slips. The edge where a name might have been is torn away.","followUp":"Can you say who wrote it?","followReply":"Not from that fragment. Compare it with the register rather than taking my memory as proof.","availableWhen":{"always":true}},{"id":"mara","ask":"Why is Mara’s map filed with these clock records?","reply":"She surveyed the tower when its access stairs were repaired. The archive kept her drawing with the maintenance papers.","followUp":"Does it show anything the public plan leaves out?","followReply":"A service landing behind the dial. Take a copy; the route is easier to understand when you see the stairs.","availableWhen":{"always":true}}]},{"id":"lena","name":"Lena Vale","role":"Town archivist","bio":"An observant archivist who trusts paper records, even when they disagree.","initials":"LV","questions":[{"id":"ledger","ask":"Was this ledger leaf lost through ordinary wear?","reply":"The stitching is whole and the cut is straight. A single leaf was removed from the eleven o’clock section.","followUp":"Does that identify who removed it?","followReply":"No. It shows deliberate removal, but the page has no remaining signature or record of who last handled it.","availableWhen":{"always":true}},{"id":"mara","ask":"What can the night register stamp establish?","reply":"The ledger reached this reading room at 11:20. A later annotation crosses the dry edge of the stamp.","followUp":"Can we date the alteration more precisely?","followReply":"Only after that stamp was made. A record can prove an order of events without naming the person responsible.","availableWhen":{"always":true}}]},{"id":"poppy","name":"Poppy Whitmore","role":"Local researcher","bio":"A curious, meticulous researcher who pieces together the town’s history from its records and remembered sounds.","initials":"PW","questions":[{"id":"sound","ask":"What are you comparing in the archive?","reply":"The market bell log and the tower register. They use different clocks, so I am checking the reference times first.","followUp":"Where can we test whether those times agree?","followReply":"With the bell keeper in the square. A written time needs a reliable clock behind it.","availableWhen":{"always":true}},{"id":"promise","ask":"Does the missing page leave any other trace?","reply":"Its page number appears in the index, but the next entry skips straight past it. The omission is not a numbering mistake.","followUp":"What does that let us conclude for now?","followReply":"Someone removed a record. We still need evidence to connect that act to the stopped clock.","availableWhen":{"always":true}}]},{"id":"biscuit","name":"Biscuit","role":"Elias’s golden retriever · your sidekick","bio":"Affectionate, curious, and exceptionally good at noticing scents people overlook.","initials":"🐾","companion":true,"questions":[]}],"puzzle":{"id":"forgotten-hour-deduction","type":"choice","title":"What does the archive show?","prompt":"Which conclusion is supported by the records?","answer":"withheld","options":[{"id":"error","label":"The clerk made an ordinary copying mistake.","icon":"book"},{"id":"withheld","label":"Someone intentionally withheld the stopped hour from the public record.","icon":"inspect"},{"id":"fast","label":"The clock was simply running fast.","icon":"clock"}],"presentation":{"evidenceRefs":["archive-gap","repair-note","archive-stamp"]}},"gate":{"allEvidence":["archive-gap","repair-note","archive-stamp"],"allDialogue":["forgotten-hour:clockmaker:route","forgotten-hour:clockmaker:mara","forgotten-hour:lena:ledger","forgotten-hour:lena:mara","forgotten-hour:poppy:sound","forgotten-hour:poppy:promise"]},"hints":["The binding is not damaged; only one leaf is missing.","The unsigned service slip records the same minute as the stopped watch; it does not name its author.","The ledger was amended after the archive closed."],"clue":"A ledger leaf was deliberately removed. An unsigned service slip records 11:47, but neither record identifies who altered the ledger or stopped the clock.","success":"The evidence reveals a new lead. Biscuit is ready to follow it.","companionSearch":{"targets":["archive-gap","repair-note","archive-stamp"],"searchMessage":"Biscuit is sniffing around the scene…","foundMessage":"Biscuit found a clue! Take a closer look.","emptyMessage":"Biscuit has searched the reachable corners. Examine any remaining scene markers."},"companionFloor":{"left":0.08,"right":0.82,"top":0.72,"bottom":0.96}},{"id":"town-square","title":"The Town Square","location":"Town Square","subtitle":"A bell log and a sketch help reconstruct the last few minutes.","scene":"assets/story07/town-square-hd.png","intro":"The bell log and a child’s sketch place a tool-carrying figure near the tower before the clock stopped. The times can be compared, but the sketch does not show a clear face.","evidence":[{"id":"market-bell","title":"The market bell schedule","icon":"♧","position":{"x":22,"y":60},"markerPosition":{"x":22,"y":65},"detail":"The market bell was checked at 11:42. Its keeper notes a quieter chime from the tower stairwell five minutes later.","note":"A second chime came from the tower stairwell at 11:47."},{"id":"fountain-witness","title":"The fountain-side sketch","icon":"✎","position":{"x":76,"y":55},"markerPosition":{"x":76,"y":60},"detail":"A child’s sketch shows a tall figure carrying a narrow tool case toward the clock tower. The corner is dated 11:44.","note":"A witness saw a figure carrying tools to the tower."},{"id":"tower-dust","title":"Copper dust on a work cloth","icon":"✧","position":{"x":52,"y":80},"markerPosition":{"x":52,"y":85},"detail":"Fine copper-colored dust on a work cloth matches the dust inside the tower service hatch. The workshop uses no copper filings.","note":"Tower dust reached the workshop after the clock stopped."}],"characters":[{"id":"clockmaker","name":"Elias Bell","role":"Clockmaker","bio":"Patient and precise. Since his partner Mara died, Elias has grown quieter and more protective of the town clock.","initials":"EB","questions":[{"id":"route","ask":"Which way did you go when the bell fell silent?","reply":"Across the square toward the tower. I carried a tool case, as I do whenever a clock needs attention.","followUp":"The sketch is marked 11:44. Can you account for that?","followReply":"I did not look at a clock on the way. Check the witness’s time against the bell log; I may have the order wrong.","availableWhen":{"always":true}},{"id":"mara","ask":"Is that copper dust from your workshop?","reply":"We work mostly in brass here. The old tower fittings shed a finer copper-coloured dust.","followUp":"Could it have reached the cloth on another visit?","followReply":"Possibly. It needs comparing with the hatch itself before you draw a conclusion from its colour.","availableWhen":{"always":true}}]},{"id":"poppy","name":"Poppy Whitmore","role":"Local researcher","bio":"A curious, meticulous researcher who pieces together the town’s history from its records and remembered sounds.","initials":"PW","questions":[{"id":"sound","ask":"What does the bell keeper remember about the final chime?","reply":"The market bell was checked at 11:42. Five minutes later, the keeper heard a smaller chime from the tower stairs.","followUp":"Was it the market bell sounding again?","followReply":"No. Its keeper was beside the bell then. That gives us two sounds, not two readings of the same bell.","availableWhen":{"always":true}},{"id":"promise","ask":"Can the child’s sketch identify the figure?","reply":"It shows a narrow case and a coat, but no clear face. The child wrote 11:44 in the corner.","followUp":"How should we use a drawing that uncertain?","followReply":"Keep the time and direction as a lead. A silhouette should not become a name just because we expect one.","availableWhen":{"always":true}}]},{"id":"jonah","name":"Jonah Reed","role":"Clockmaker’s apprentice","bio":"A quick-handed apprentice who knows every sound the tower mechanism can make.","initials":"JR","questions":[{"id":"tool","ask":"Does the case in the sketch belong to one person?","reply":"Several tower workers carry cases that shape. The drawing cannot distinguish their buckles or straps.","followUp":"What would give us a stronger comparison?","followReply":"A physical tool or a mark inside the hatch. Those can be checked against something more precise than a sketch.","availableWhen":{"always":true}},{"id":"hatch","ask":"Where would that route lead inside the tower?","reply":"The side stair reaches Mara’s service landing. The public stair turns away below it.","followUp":"Can we inspect the landing without starting the clock?","followReply":"Yes. We can secure the movement first and look behind the dial without letting the pendulum run.","availableWhen":{"always":true}}]},{"id":"biscuit","name":"Biscuit","role":"Elias’s golden retriever · your sidekick","bio":"Affectionate, curious, and exceptionally good at noticing scents people overlook.","initials":"🐾","companion":true,"questions":[]}],"puzzle":{"id":"town-square-timeline","type":"sequence","title":"Rebuild the square’s timeline","prompt":"Arrange the events from earliest to latest using the bell, sketch, and stopped watch.","items":[{"id":"market","label":"Market bell checked","caption":"11:42","image":"assets/story07/town-square-hd.png","imageAlt":"The Town Square"},{"id":"tower","label":"Figure approaches the tower","caption":"11:44","image":"assets/story07/town-square-hd.png","imageAlt":"The Town Square"},{"id":"stop","label":"The clock stops","caption":"11:47","image":"assets/story07/town-square-hd.png","imageAlt":"The Town Square"}],"answer":["market","tower","stop"],"presentation":{"mode":"timeline-clean","layout":"card-slots","sideImage":"assets/story07/town-square-hd.png","sideImageAlt":"The Town Square","timelineTitle":"Your sequence","timelineDescription":"First to last","actions":[{"action":"check","label":"Check sequence"},{"action":"reset","label":"Reset arrangement"},{"action":"hint","label":"Progressive hint"},{"action":"close","label":"Return to investigation"}]}},"gate":{"allEvidence":["market-bell","fountain-witness","tower-dust"],"allDialogue":["town-square:clockmaker:route","town-square:clockmaker:mara","town-square:poppy:sound","town-square:poppy:promise","town-square:jonah:tool","town-square:jonah:hatch"]},"hints":["Use the recorded times, not the order in which witnesses spoke.","The market bell is first, the sketch next, and the watch stops last.","11:42 → 11:44 → 11:47."],"clue":"The 11:42 bell check precedes the 11:44 sketch and the 11:47 stop. The unidentified figure’s route leads to the service landing.","success":"The evidence reveals a new lead. Biscuit is ready to follow it.","companionSearch":{"targets":["market-bell","fountain-witness","tower-dust"],"searchMessage":"Biscuit is sniffing around the scene…","foundMessage":"Biscuit found a clue! Take a closer look.","emptyMessage":"Biscuit has searched the reachable corners. Examine any remaining scene markers."},"companionFloor":{"left":0.08,"right":0.82,"top":0.72,"bottom":0.96}},{"id":"hidden-mechanism","title":"The Hidden Mechanism","location":"Hidden Mechanism","subtitle":"The clock has a second mechanism behind its familiar face.","scene":"assets/story07/hidden-mechanism-hd.png","intro":"The service hatch opens onto a narrow brass assembly. A hidden stop pawl has been removed, and the marks are fresh and unusually careful.","evidence":[{"id":"stop-pawl","title":"The removed stop pawl","icon":"⚙","position":{"x":37,"y":60},"markerPosition":{"x":37,"y":65},"detail":"The pawl was lifted without breaking its retaining pin. A thin leather strip protected its edge while it was removed.","note":"The stop pawl was carefully removed."},{"id":"tool-mark","title":"The matching tool mark","icon":"⌁","position":{"x":72,"y":45},"markerPosition":{"x":72,"y":50},"detail":"The narrow scratch fits the profile of the lifter missing from the workshop. Several crew members have access to those tools.","note":"The mark links a shared workshop tool to the mechanism, without identifying its user."},{"id":"folded-note","title":"The folded note behind the dial","icon":"▤","position":{"x":50,"y":78},"markerPosition":{"x":50,"y":83},"detail":"A folded keepsake note reads: “E + M · the terrace, when the bell can ring again.” The initials match Biscuit’s tag, but the note has no date.","note":"An undated E + M note points toward the terrace and a personal explanation."}],"characters":[{"id":"clockmaker","name":"Elias Bell","role":"Clockmaker","bio":"Patient and precise. Since his partner Mara died, Elias has grown quieter and more protective of the town clock.","initials":"EB","questions":[{"id":"route","ask":"What do you notice about the exposed regulator?","reply":"The retaining pin is intact. Whoever worked here knew how to avoid breaking it.","followUp":"Does careful work rule out an ordinary repair?","followReply":"Not by itself. Check the pawl, the spring and the tool mark together; one neat surface is not the whole story.","availableWhen":{"always":true}},{"id":"mara","ask":"Why is there an E + M note behind the dial?","reply":"Mara and I left notes in places we thought only the other would notice. I had not expected to see that one again.","followUp":"Will you explain what it meant to you?","followReply":"On the terrace, with her letter beside it. I owe you an answer that does not leave out the difficult part.","availableWhen":{"always":true}}]},{"id":"jonah","name":"Jonah Reed","role":"Clockmaker’s apprentice","bio":"A quick-handed apprentice who knows every sound the tower mechanism can make.","initials":"JR","questions":[{"id":"tool","ask":"Can you compare this scratch with the missing lifter?","reply":"The width fits the lifter’s edge, and the protected surface fits a leather-wrapped grip.","followUp":"Does that tell us whose hand held it?","followReply":"It links a workshop tool to the mechanism. A shared tool cannot identify its user on its own.","availableWhen":{"always":true}},{"id":"hatch","ask":"Why did the service hatch make so little noise?","reply":"Its hinges were recently oiled. The latch can close with only a soft click if someone catches it by hand.","followUp":"Could a visitor have missed someone coming through?","followReply":"Yes, particularly with the market bell outside. We should not treat an unheard door as an unused door.","availableWhen":{"always":true}}]},{"id":"alden","name":"Alden Shaw","role":"Tower engineer","bio":"A careful engineer who maintains the town clock and records every repair.","initials":"AS","questions":[{"id":"mechanism","ask":"What does the condition of the stop pawl show?","reply":"The pin was eased out rather than sheared, and the spring was restrained. That sequence requires a deliberate intervention.","followUp":"Can we restore it without risking the clock train?","followReply":"We can plan the order now. Keep the pendulum secured until the pawl, spring and escapement are all checked.","availableWhen":{"always":true}},{"id":"repair","ask":"Does the maintenance card identify the last visitor?","reply":"Elias signed the scheduled service earlier. There is no signed entry for the later intervention we are examining.","followUp":"Can you identify its author from the tool mark?","followReply":"I can identify the tool’s profile, not a person. The note and the timeline must supply the rest of the account.","availableWhen":{"always":true}}]},{"id":"biscuit","name":"Biscuit","role":"Elias’s golden retriever · your sidekick","bio":"Affectionate, curious, and exceptionally good at noticing scents people overlook.","initials":"🐾","companion":true,"questions":[]}],"puzzle":{"id":"hidden-mechanism-order","type":"sequence","title":"Plan the clockwork repair","prompt":"Arrange the safe repair steps before the movement is restarted.","items":[{"id":"pawl","label":"Return the stop pawl","caption":"Restore the stop point.","image":"assets/story07/hidden-mechanism-hd.png","imageAlt":"The Hidden Mechanism"},{"id":"spring","label":"Seat the return spring","caption":"Secure the pawl.","image":"assets/story07/hidden-mechanism-hd.png","imageAlt":"The Hidden Mechanism"},{"id":"wheel","label":"Align the escapement wheel","caption":"Reconnect the clock train.","image":"assets/story07/hidden-mechanism-hd.png","imageAlt":"The Hidden Mechanism"},{"id":"pendulum","label":"Release the pendulum","caption":"Let time move again.","image":"assets/story07/hidden-mechanism-hd.png","imageAlt":"The Hidden Mechanism"}],"answer":["pawl","spring","wheel","pendulum"],"presentation":{"mode":"timeline-clean","layout":"card-slots","sideImage":"assets/story07/hidden-mechanism-hd.png","sideImageAlt":"The Hidden Mechanism","timelineTitle":"Your sequence","timelineDescription":"First to last","actions":[{"action":"check","label":"Check sequence"},{"action":"reset","label":"Reset arrangement"},{"action":"hint","label":"Progressive hint"},{"action":"close","label":"Return to investigation"}]}},"gate":{"allEvidence":["stop-pawl","tool-mark","folded-note"],"allDialogue":["hidden-mechanism:clockmaker:route","hidden-mechanism:clockmaker:mara","hidden-mechanism:jonah:tool","hidden-mechanism:jonah:hatch","hidden-mechanism:alden:mechanism","hidden-mechanism:alden:repair"]},"hints":["The pawl holds the stop; return it before the spring.","Align the escapement before releasing the pendulum.","Pawl → spring → wheel → pendulum."],"clue":"The clock was deliberately stopped with a tool from the workshop. The physical evidence identifies a method, while the undated note points to the terrace for an explanation.","success":"The evidence reveals a new lead. Biscuit is ready to follow it.","companionSearch":{"targets":["stop-pawl","tool-mark","folded-note"],"searchMessage":"Biscuit is sniffing around the scene…","foundMessage":"Biscuit found a clue! Take a closer look.","emptyMessage":"Biscuit has searched the reachable corners. Examine any remaining scene markers."},"companionFloor":{"left":0.08,"right":0.82,"top":0.72,"bottom":0.96}},{"id":"last-hour","title":"The Clockmaker’s Last Hour","location":"Clockmaker’s Last Hour · Sunset Terrace","subtitle":"At sunset, the minute finally has room to move.","scene":"assets/story07/sunset-terrace-hd.png","intro":"Elias waits on the terrace with Biscuit and an old pocket watch. The final clues connect his tool, the missing record, and a promise he could not bring himself to release.","evidence":[{"id":"terrace-watch","title":"Mara’s pocket watch","icon":"◷","position":{"x":39,"y":65},"markerPosition":{"x":39,"y":70},"detail":"The watch is engraved E + M, set to 11:47, and its repaired crown bears Elias’s tool mark.","note":"Mara’s watch was set to the stopped minute."},{"id":"terrace-letter","title":"The unsent letter","icon":"✉","position":{"x":61,"y":64},"markerPosition":{"x":61,"y":69},"detail":"“When the town clock reaches twelve, we will start again together.” The letter is signed by Mara and addressed to Elias.","note":"Mara’s promise explains why 11:47 mattered."},{"id":"biscuit-ribbon","title":"Biscuit’s sunset ribbon","icon":"✦","position":{"x":26,"y":49},"markerPosition":{"x":26,"y":54},"detail":"Tied beneath Biscuit’s collar is a faded ribbon from the night the clock stopped. Elias kept it beside the watch.","note":"Elias kept the memory close rather than destroying it."}],"characters":[{"id":"clockmaker","name":"Elias Bell","role":"Clockmaker","bio":"Patient and precise. Since his partner Mara died, Elias has grown quieter and more protective of the town clock.","initials":"EB","questions":[{"id":"truth","ask":"Did you stop the clock?","reply":"Yes. I removed the stop pawl and held the town clock at 11:47.","followUp":"Why did you choose that minute?","followReply":"It was the last minute Mara and I shared on the terrace before she died. I could not make myself let the clock move on.","availableWhen":{"always":true}},{"id":"repair","ask":"What will you do now?","reply":"Carry out the repair we planned, record what I did honestly, and apologize to the town.","followUp":"And the people who waited for the bell?","followReply":"I will face them. I cannot undo the waiting, but I can stop asking them to live inside my grief.","availableWhen":{"always":true}}]},{"id":"lena","name":"Lena Vale","role":"Town archivist","bio":"An observant archivist who trusts paper records, even when they disagree.","initials":"LV","questions":[{"id":"ledger","ask":"How should the archive record the truth now?","reply":"The missing leaf must be documented as missing. Elias’s account belongs in a dated correction, with the evidence attached.","followUp":"Should we make the record look as though nothing happened?","followReply":"No. A clear correction preserves both the original gap and how the town finally learned what happened.","availableWhen":{"always":true}},{"id":"mara","ask":"What does Mara’s letter say about their promise?","reply":"She wrote about starting again together when the town clock reached twelve. It was a hope for their future.","followUp":"Does the letter ask anyone to hold the clock at 11:47?","followReply":"It does not. Elias’s wish to keep that minute was his response to losing her, not an instruction she left.","availableWhen":{"always":true}}]},{"id":"poppy","name":"Poppy Whitmore","role":"Local researcher","bio":"A curious, meticulous researcher who pieces together the town’s history from its records and remembered sounds.","initials":"PW","questions":[{"id":"sound","ask":"What will you tell the bell keeper?","reply":"That the silence had a human cause, and that Elias is ready to explain his part himself.","followUp":"How can we keep the explanation fair to everyone?","followReply":"Include the people who waited and worried. Understanding his loss should not erase what the town experienced.","availableWhen":{"always":true}},{"id":"promise","ask":"What should happen to Mara’s watch and the ribbon?","reply":"Let Elias choose a place for them here. A keepsake can preserve a memory without making the whole town stand still.","followUp":"And when the bell rings again?","followReply":"We can stay with him to hear it. He should not have to face that first sound alone.","availableWhen":{"always":true}}]},{"id":"biscuit","name":"Biscuit","role":"Elias’s golden retriever · your sidekick","bio":"Affectionate, curious, and exceptionally good at noticing scents people overlook.","initials":"🐾","companion":true,"questions":[]}],"puzzle":{"id":"last-hour-reveal","type":"choice","title":"Name the truth with care","prompt":"Which explanation fits the records, witness accounts, tool marks, and Mara’s letter?","answer":"elias","options":[{"id":"accident","label":"The clock stopped from ordinary wear, and the matching marks are coincidence.","icon":"clock"},{"id":"jonah","label":"Jonah stopped it to protect Elias from a repair mistake.","icon":"inspect"},{"id":"elias","label":"Elias stopped the clock to hold onto the last minute he shared with Mara.","icon":"flower"}],"presentation":{"mode":"single-question-clues","evidenceRefs":["terrace-watch","terrace-letter","biscuit-ribbon"],"sectionLabel":"Final clues · Clockmaker’s Last Hour","answerLabel":"Choose the explanation","actions":[{"action":"submit","label":"Share your conclusion"},{"action":"hint","label":"A gentle hint"},{"action":"evidence","label":"Review Mara’s letter","target":"terrace-letter"},{"action":"close","label":"Return to terrace"}]}},"gate":{"allEvidence":["terrace-watch","terrace-letter","biscuit-ribbon"],"allDialogue":["last-hour:clockmaker:truth","last-hour:clockmaker:repair","last-hour:lena:ledger","last-hour:lena:mara","last-hour:poppy:sound","last-hour:poppy:promise"]},"hints":["Compare the service hatch mark with the tool missing from the workshop.","Compare the undated terrace note with Mara’s letter and Elias’s account of the last minute they shared.","Elias stopped the clock to keep 11:47 from becoming the past."],"clue":"Elias stopped the clock to hold onto the last minute he shared with Mara. He must choose how to make amends with the town.","success":"Elias tells the truth: he stopped the clock himself to remain with the memory of 11:47.","companionSearch":{"targets":["terrace-watch","terrace-letter","biscuit-ribbon"],"searchMessage":"Biscuit is sniffing around the scene…","foundMessage":"Biscuit found a clue! Take a closer look.","emptyMessage":"Biscuit has searched the reachable corners. Examine any remaining scene markers."},"endings":[{"id":"repair-together","label":"Repair the clock together","text":"Elias restores the clock and tells the town the whole story. They help him remember Mara without holding time still."},{"id":"public-account","label":"Make a public account first","text":"Elias writes a full account for the town records and accepts responsibility before the repair begins."},{"id":"quiet-apology","label":"Begin with a quiet apology","text":"Elias meets the people who waited in the square, beginning with a personal apology before asking the town to trust the repaired clock."}],"companionFloor":{"left":0.08,"right":0.82,"top":0.72,"bottom":0.96}}],"conversationScript":[{"opening":[{"speaker":"clockmaker","text":"I asked you here because the town clock stopped at 11:47. I need a second pair of eyes before I try to repair it.","expression":"thoughtful","direction":"Elias turns the watch face down."},{"speaker":"you","text":"You said you wanted another pair of eyes. Where should I begin?","to":"clockmaker","expression":"curious"},{"speaker":"clockmaker","text":"The workshop first. Look at the watch, the empty tool slot, and anything that seems out of place.","expression":"guarded"},{"speaker":"biscuit","text":"Woof! Biscuit noses the door and looks back at you, ready to lead the way.","expression":"excited"},{"speaker":"clockmaker","text":"He knows the workshop better than I do. Let him help, if he chooses to.","expression":"warm"}],"topics":[{"focus":"clockmaker","label":"When did you first notice the clock had stopped?","lines":[{"speaker":"you","to":"clockmaker","text":"When did you first notice the clock had stopped?","expression":"curious"},{"speaker":"clockmaker","text":"At 11:47. I checked this watch against the tower dial, then came back to the bench.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Is that enough to tell what caused it?","expression":"thoughtful"},{"speaker":"clockmaker","text":"No. A stopped hand tells us when, not why. Please examine the case before we touch the movement.","expression":"steady"}]},{"focus":"clockmaker","label":"Who are E and M on Biscuit’s tag?","lines":[{"speaker":"you","to":"clockmaker","text":"Who are E and M on Biscuit’s tag?","expression":"curious"},{"speaker":"clockmaker","text":"Elias and Mara. She chose that little brass tag when Biscuit was a puppy.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Was she a clockmaker too?","expression":"thoughtful"},{"speaker":"clockmaker","text":"A cartographer. She could find a way through a room full of gears faster than I could draw one.","expression":"steady"}]},{"focus":"lena","label":"Why have you come to the workshop?","lines":[{"speaker":"you","to":"lena","text":"Why have you come to the workshop?","expression":"curious"},{"speaker":"lena","text":"Elias asked me to bring the archive key. Public clock repairs are usually entered in the town ledger.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Can the ledger tell us what happened tonight?","expression":"thoughtful"},{"speaker":"lena","text":"It may give us a time to compare. We need to read it before treating a guess as a record.","expression":"steady"}]},{"focus":"lena","label":"Did Mara help with the tower plans?","lines":[{"speaker":"you","to":"lena","text":"Did Mara help with the tower plans?","expression":"curious"},{"speaker":"lena","text":"She drew the access routes and numbered the service landings. Her maps are still useful to the crew.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Where can we check those drawings?","expression":"thoughtful"},{"speaker":"lena","text":"The archive keeps the old maintenance papers. I can help you find the right cabinet there.","expression":"steady"}]},{"focus":"jonah","label":"Is the empty tool slot unusual?","lines":[{"speaker":"you","to":"jonah","text":"Is the empty tool slot unusual?","expression":"curious"},{"speaker":"jonah","text":"Tools are taken out for ordinary repairs. What catches my eye is the clean outline in otherwise settled dust.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"Can you identify which tool is missing?","expression":"thoughtful"},{"speaker":"jonah","text":"A narrow brass lifter. Let us find it before deciding what anyone used it for.","expression":"steady"}]},{"focus":"jonah","label":"How is the tower normally serviced?","lines":[{"speaker":"you","to":"jonah","text":"How is the tower normally serviced?","expression":"curious"},{"speaker":"jonah","text":"Through a small hatch above the stairs. The crew uses it to reach the regulator without removing the dial.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"Who is allowed to use that access?","expression":"thoughtful"},{"speaker":"jonah","text":"The clockmaker and the maintenance crew. It is a working entrance, not a private room.","expression":"steady"}]}],"openingCharacterId":"clockmaker"},{"opening":[{"speaker":"clockmaker","text":"The register may tell us something my workshop cannot. Lena knows how these pages were kept.","expression":"thoughtful"},{"speaker":"you","text":"Then we will check the dates and the binding before deciding what the gap means.","expression":"steady","to":"clockmaker"},{"speaker":"clockmaker","text":"I brought the archive key. Let us leave the papers in their order as we read.","expression":"attentive"}],"topics":[{"focus":"clockmaker","label":"Do you recognise this unsigned repair note?","lines":[{"speaker":"you","to":"clockmaker","text":"Do you recognise this unsigned repair note?","expression":"curious"},{"speaker":"clockmaker","text":"It uses the shorthand we keep on service slips. The edge where a name might have been is torn away.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Can you say who wrote it?","expression":"thoughtful"},{"speaker":"clockmaker","text":"Not from that fragment. Compare it with the register rather than taking my memory as proof.","expression":"steady"}]},{"focus":"clockmaker","label":"Why is Mara’s map filed with these clock records?","lines":[{"speaker":"you","to":"clockmaker","text":"Why is Mara’s map filed with these clock records?","expression":"curious"},{"speaker":"clockmaker","text":"She surveyed the tower when its access stairs were repaired. The archive kept her drawing with the maintenance papers.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Does it show anything the public plan leaves out?","expression":"thoughtful"},{"speaker":"clockmaker","text":"A service landing behind the dial. Take a copy; the route is easier to understand when you see the stairs.","expression":"steady"}]},{"focus":"lena","label":"Was this ledger leaf lost through ordinary wear?","lines":[{"speaker":"you","to":"lena","text":"Was this ledger leaf lost through ordinary wear?","expression":"curious"},{"speaker":"lena","text":"The stitching is whole and the cut is straight. A single leaf was removed from the eleven o’clock section.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Does that identify who removed it?","expression":"thoughtful"},{"speaker":"lena","text":"No. It shows deliberate removal, but the page has no remaining signature or record of who last handled it.","expression":"steady"}]},{"focus":"lena","label":"What can the night register stamp establish?","lines":[{"speaker":"you","to":"lena","text":"What can the night register stamp establish?","expression":"curious"},{"speaker":"lena","text":"The ledger reached this reading room at 11:20. A later annotation crosses the dry edge of the stamp.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Can we date the alteration more precisely?","expression":"thoughtful"},{"speaker":"lena","text":"Only after that stamp was made. A record can prove an order of events without naming the person responsible.","expression":"steady"}]},{"focus":"poppy","label":"What are you comparing in the archive?","lines":[{"speaker":"you","to":"poppy","text":"What are you comparing in the archive?","expression":"curious"},{"speaker":"poppy","text":"The market bell log and the tower register. They use different clocks, so I am checking the reference times first.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"Where can we test whether those times agree?","expression":"thoughtful"},{"speaker":"poppy","text":"With the bell keeper in the square. A written time needs a reliable clock behind it.","expression":"steady"}]},{"focus":"poppy","label":"Does the missing page leave any other trace?","lines":[{"speaker":"you","to":"poppy","text":"Does the missing page leave any other trace?","expression":"curious"},{"speaker":"poppy","text":"Its page number appears in the index, but the next entry skips straight past it. The omission is not a numbering mistake.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"What does that let us conclude for now?","expression":"thoughtful"},{"speaker":"poppy","text":"Someone removed a record. We still need evidence to connect that act to the stopped clock.","expression":"steady"}]}],"openingCharacterId":"clockmaker"},{"opening":[{"speaker":"clockmaker","text":"There are several clocks in the square. We should find out which one each witness was using.","expression":"thoughtful"},{"speaker":"you","text":"I will separate what they saw from the names they have guessed.","expression":"curious","to":"clockmaker"},{"speaker":"clockmaker","text":"The keeper is by the market bell; the sketch was made near the fountain.","expression":"steady"}],"topics":[{"focus":"clockmaker","label":"Which way did you go when the bell fell silent?","lines":[{"speaker":"you","to":"clockmaker","text":"Which way did you go when the bell fell silent?","expression":"curious"},{"speaker":"clockmaker","text":"Across the square toward the tower. I carried a tool case, as I do whenever a clock needs attention.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"The sketch is marked 11:44. Can you account for that?","expression":"thoughtful"},{"speaker":"clockmaker","text":"I did not look at a clock on the way. Check the witness’s time against the bell log; I may have the order wrong.","expression":"steady"}]},{"focus":"clockmaker","label":"Is that copper dust from your workshop?","lines":[{"speaker":"you","to":"clockmaker","text":"Is that copper dust from your workshop?","expression":"curious"},{"speaker":"clockmaker","text":"We work mostly in brass here. The old tower fittings shed a finer copper-coloured dust.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Could it have reached the cloth on another visit?","expression":"thoughtful"},{"speaker":"clockmaker","text":"Possibly. It needs comparing with the hatch itself before you draw a conclusion from its colour.","expression":"steady"}]},{"focus":"poppy","label":"What does the bell keeper remember about the final chime?","lines":[{"speaker":"you","to":"poppy","text":"What does the bell keeper remember about the final chime?","expression":"curious"},{"speaker":"poppy","text":"The market bell was checked at 11:42. Five minutes later, the keeper heard a smaller chime from the tower stairs.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"Was it the market bell sounding again?","expression":"thoughtful"},{"speaker":"poppy","text":"No. Its keeper was beside the bell then. That gives us two sounds, not two readings of the same bell.","expression":"steady"}]},{"focus":"poppy","label":"Can the child’s sketch identify the figure?","lines":[{"speaker":"you","to":"poppy","text":"Can the child’s sketch identify the figure?","expression":"curious"},{"speaker":"poppy","text":"It shows a narrow case and a coat, but no clear face. The child wrote 11:44 in the corner.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"How should we use a drawing that uncertain?","expression":"thoughtful"},{"speaker":"poppy","text":"Keep the time and direction as a lead. A silhouette should not become a name just because we expect one.","expression":"steady"}]},{"focus":"jonah","label":"Does the case in the sketch belong to one person?","lines":[{"speaker":"you","to":"jonah","text":"Does the case in the sketch belong to one person?","expression":"curious"},{"speaker":"jonah","text":"Several tower workers carry cases that shape. The drawing cannot distinguish their buckles or straps.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"What would give us a stronger comparison?","expression":"thoughtful"},{"speaker":"jonah","text":"A physical tool or a mark inside the hatch. Those can be checked against something more precise than a sketch.","expression":"steady"}]},{"focus":"jonah","label":"Where would that route lead inside the tower?","lines":[{"speaker":"you","to":"jonah","text":"Where would that route lead inside the tower?","expression":"curious"},{"speaker":"jonah","text":"The side stair reaches Mara’s service landing. The public stair turns away below it.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"Can we inspect the landing without starting the clock?","expression":"thoughtful"},{"speaker":"jonah","text":"Yes. We can secure the movement first and look behind the dial without letting the pendulum run.","expression":"steady"}]}],"openingCharacterId":"clockmaker"},{"opening":[{"speaker":"clockmaker","text":"The service landing is just as Mara drew it. Keep the pendulum secured while we inspect the regulator.","expression":"guarded"},{"speaker":"you","text":"We can compare the marks without changing the mechanism.","expression":"attentive","to":"clockmaker"},{"speaker":"clockmaker","text":"Yes. And if you find anything personal among the fittings, please let me see it.","expression":"thoughtful"}],"topics":[{"focus":"clockmaker","label":"What do you notice about the exposed regulator?","lines":[{"speaker":"you","to":"clockmaker","text":"What do you notice about the exposed regulator?","expression":"curious"},{"speaker":"clockmaker","text":"The retaining pin is intact. Whoever worked here knew how to avoid breaking it.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Does careful work rule out an ordinary repair?","expression":"thoughtful"},{"speaker":"clockmaker","text":"Not by itself. Check the pawl, the spring and the tool mark together; one neat surface is not the whole story.","expression":"steady"}]},{"focus":"clockmaker","label":"Why is there an E + M note behind the dial?","lines":[{"speaker":"you","to":"clockmaker","text":"Why is there an E + M note behind the dial?","expression":"curious"},{"speaker":"clockmaker","text":"Mara and I left notes in places we thought only the other would notice. I had not expected to see that one again.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Will you explain what it meant to you?","expression":"thoughtful"},{"speaker":"clockmaker","text":"On the terrace, with her letter beside it. I owe you an answer that does not leave out the difficult part.","expression":"steady"}]},{"focus":"jonah","label":"Can you compare this scratch with the missing lifter?","lines":[{"speaker":"you","to":"jonah","text":"Can you compare this scratch with the missing lifter?","expression":"curious"},{"speaker":"jonah","text":"The width fits the lifter’s edge, and the protected surface fits a leather-wrapped grip.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"Does that tell us whose hand held it?","expression":"thoughtful"},{"speaker":"jonah","text":"It links a workshop tool to the mechanism. A shared tool cannot identify its user on its own.","expression":"steady"}]},{"focus":"jonah","label":"Why did the service hatch make so little noise?","lines":[{"speaker":"you","to":"jonah","text":"Why did the service hatch make so little noise?","expression":"curious"},{"speaker":"jonah","text":"Its hinges were recently oiled. The latch can close with only a soft click if someone catches it by hand.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"jonah","text":"Could a visitor have missed someone coming through?","expression":"thoughtful"},{"speaker":"jonah","text":"Yes, particularly with the market bell outside. We should not treat an unheard door as an unused door.","expression":"steady"}]},{"focus":"alden","label":"What does the condition of the stop pawl show?","lines":[{"speaker":"you","to":"alden","text":"What does the condition of the stop pawl show?","expression":"curious"},{"speaker":"alden","text":"The pin was eased out rather than sheared, and the spring was restrained. That sequence requires a deliberate intervention.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"alden","text":"Can we restore it without risking the clock train?","expression":"thoughtful"},{"speaker":"alden","text":"We can plan the order now. Keep the pendulum secured until the pawl, spring and escapement are all checked.","expression":"steady"}]},{"focus":"alden","label":"Does the maintenance card identify the last visitor?","lines":[{"speaker":"you","to":"alden","text":"Does the maintenance card identify the last visitor?","expression":"curious"},{"speaker":"alden","text":"Elias signed the scheduled service earlier. There is no signed entry for the later intervention we are examining.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"alden","text":"Can you identify its author from the tool mark?","expression":"thoughtful"},{"speaker":"alden","text":"I can identify the tool’s profile, not a person. The note and the timeline must supply the rest of the account.","expression":"steady"}]}],"openingCharacterId":"clockmaker"},{"opening":[{"speaker":"clockmaker","text":"You brought the watch and the letter. I have run out of ways to avoid what they mean.","expression":"thoughtful"},{"speaker":"you","text":"Then tell us what happened at 11:47, in your own words.","expression":"steady","to":"clockmaker"},{"speaker":"clockmaker","text":"Sit with me a moment. I will answer, and this time I will not leave anything out.","expression":"tender"}],"topics":[{"focus":"clockmaker","label":"Did you stop the clock?","lines":[{"speaker":"you","to":"clockmaker","text":"Did you stop the clock?","expression":"curious"},{"speaker":"clockmaker","text":"Yes. I removed the stop pawl and held the town clock at 11:47.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"Why did you choose that minute?","expression":"thoughtful"},{"speaker":"clockmaker","text":"It was the last minute Mara and I shared on the terrace before she died. I could not make myself let the clock move on.","expression":"tender"}]},{"focus":"clockmaker","label":"What will you do now?","lines":[{"speaker":"you","to":"clockmaker","text":"What will you do now?","expression":"curious"},{"speaker":"clockmaker","text":"Carry out the repair we planned, record what I did honestly, and apologize to the town.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"clockmaker","text":"And the people who waited for the bell?","expression":"thoughtful"},{"speaker":"clockmaker","text":"I will face them. I cannot undo the waiting, but I can stop asking them to live inside my grief.","expression":"tender"}]},{"focus":"lena","label":"How should the archive record the truth now?","lines":[{"speaker":"you","to":"lena","text":"How should the archive record the truth now?","expression":"curious"},{"speaker":"lena","text":"The missing leaf must be documented as missing. Elias’s account belongs in a dated correction, with the evidence attached.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Should we make the record look as though nothing happened?","expression":"thoughtful"},{"speaker":"lena","text":"No. A clear correction preserves both the original gap and how the town finally learned what happened.","expression":"tender"}]},{"focus":"lena","label":"What does Mara’s letter say about their promise?","lines":[{"speaker":"you","to":"lena","text":"What does Mara’s letter say about their promise?","expression":"curious"},{"speaker":"lena","text":"She wrote about starting again together when the town clock reached twelve. It was a hope for their future.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"lena","text":"Does the letter ask anyone to hold the clock at 11:47?","expression":"thoughtful"},{"speaker":"lena","text":"It does not. Elias’s wish to keep that minute was his response to losing her, not an instruction she left.","expression":"tender"}]},{"focus":"poppy","label":"What will you tell the bell keeper?","lines":[{"speaker":"you","to":"poppy","text":"What will you tell the bell keeper?","expression":"curious"},{"speaker":"poppy","text":"That the silence had a human cause, and that Elias is ready to explain his part himself.","expression":"speaking","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"How can we keep the explanation fair to everyone?","expression":"thoughtful"},{"speaker":"poppy","text":"Include the people who waited and worried. Understanding his loss should not erase what the town experienced.","expression":"tender"}]},{"focus":"poppy","label":"What should happen to Mara’s watch and the ribbon?","lines":[{"speaker":"you","to":"poppy","text":"What should happen to Mara’s watch and the ribbon?","expression":"curious"},{"speaker":"poppy","text":"Let Elias choose a place for them here. A keepsake can preserve a memory without making the whole town stand still.","expression":"thoughtful","direction":"They pause to choose their words."},{"speaker":"you","to":"poppy","text":"And when the bell rings again?","expression":"thoughtful"},{"speaker":"poppy","text":"We can stay with him to hear it. He should not have to face that first sound alone.","expression":"tender"}]}],"openingCharacterId":"clockmaker"}],"openingIntroduction":{"id":"elias-personal-request","title":"A Minute Out of Time","characterId":"clockmaker","chapterIndex":0,"scriptedConversation":true,"text":["I asked you here because the town clock stopped at 11:47. I need a second pair of eyes before I try to repair it.","You said you wanted another pair of eyes. Where should I begin?","The workshop first. Look at the watch, the empty tool slot, and anything that seems out of place.","Woof! Biscuit noses the door and looks back at you, ready to lead the way.","He knows the workshop better than I do. Let him help, if he chooses to."],"buttonText":"Begin the investigation"},"resolution":{"title":"When the Clock Moves Again","prompt":"Elias has admitted what he did. Decide how he should begin to make things right—with the town and with Mara’s memory.","finalNote":"At sunset, the clock starts again. Biscuit gives a bark as the first bell rings, and the minute at 11:47 finally becomes part of the past."},"pageAppearance":{"backgroundImage":"assets/story07/location-concepts.png","backgroundPosition":"center center","backdropTint":"#10231c88","palette":{"accent":"#24513b","gold":"#ac7628","headingInk":"#173c2f","border":"#ddc7a2"},"layout":{"contentWidth":1540,"sidebarPercent":32,"surfaceOpacity":0.96},"peopleMode":"current","chapterPickerIcon":"compass"},"artworkReferences":{"castSheet":"assets/story07/character-cast.png","expressionSheet":"assets/story07/clockmaker-expressions-hd.png","locationConcepts":"assets/story07/location-concepts.png"},"characterPortraits":{"clockmaker":"assets/story07/clockmaker-hd.png","lena":"assets/story07/expressions/lena/01.png","jonah":"assets/story07/expressions/jonah/01.png","poppy":"assets/story07/expressions/poppy/01.png","alden":"assets/story07/expressions/alden/01.png","biscuit":"assets/story07/biscuit-hd.png"}}</script>
